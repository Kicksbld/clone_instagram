openapi: 3.1.1
info:
  title: Clone Instagram API
  version: 0.1.0
  description: |
    Contrat unique des échanges entre l'API, l'app iOS et le backoffice (ADR-003).

    - Routes métier préfixées par `/v1` ; `GET /health` est hors version.
    - JSON UTF-8, identifiants UUID v7, dates ISO 8601 UTC.
    - Authentification : `Authorization: Bearer <JWT Supabase>` sur toutes les routes sauf `GET /health`.
    - Erreurs : Problem Details (RFC 9457), `Content-Type: application/problem+json`, avec un `code` stable.

    Codes d'erreur transverses :

    | Code | Statut | Cas |
    |---|---|---|
    | `validation_failed` | 400 | Entrée non conforme au schéma (dont champ inconnu) |
    | `unauthenticated` | 401 | JWT absent, mal formé, mal signé, expiré ou d'un autre émetteur |
    | `account_suspended` | 403 | Compte suspendu ou banni (ADR-005) : toute route `/v1` est refusée, sauf `GET /v1/me` (statut du compte) et `DELETE /v1/me` |
    | `route_not_found` | 404 | Route inexistante |
    | `rate_limited` | 429 | Trop de requêtes (ADR-005) : 120 par minute et par utilisateur sur toute route `/v1`, limite plus basse sur certaines routes (documentée sur la route) ; en-tête `Retry-After` en secondes |
    | `internal_error` | 500 | Erreur inattendue ; aucun détail interne exposé |

    Codes d'erreur métier :

    | Code | Statut | Cas |
    |---|---|---|
    | `profile_not_found` | 404 | L'utilisateur authentifié n'a pas encore de profil (onboarding non terminé) |
    | `username_taken` | 409 | Username déjà utilisé par un autre profil |
    | `profile_already_exists` | 409 | L'onboarding a déjà créé le profil |
    | `age_requirement_not_met` | 422 | Moins de 13 ans à la date du jour (UTC) |
    | `media_not_found` | 404 | Média inexistant ou appartenant à un autre utilisateur |
    | `media_invalid_transition` | 409 | Le statut du média ne permet pas l'opération (ex. `complete` sur un média déjà traité) |
    | `media_not_ready` | 409 | Le média n'est pas encore `ready` |
    | `media_already_attached` | 409 | Le média est déjà utilisé, ou l'a été (un média ne sert qu'une fois) |
    | `media_purpose_mismatch` | 422 | Le `purpose` du média ne correspond pas à l'usage demandé |
    | `user_not_found` | 404 | Profil inexistant ou invisible pour l'appelant (blocage dans un sens ou dans l'autre, compte non actif : ADR-006) ; liste d'abonnés d'un compte privé non suivi |
    | `account_private` | 403 | Suivre un compte privé (demandes d'abonnement en P1) |
    | `cannot_follow_self` | 422 | Se suivre ou ne plus se suivre soi-même |
    | `invalid_cursor` | 400 | Curseur de pagination mal formé |
    | `post_not_found` | 404 | Post inexistant, supprimé ou invisible pour l'appelant (ADR-006) ; suppression du post d'un autre auteur |
    | `comment_not_found` | 404 | Commentaire inexistant, supprimé ou invisible pour l'appelant (ADR-006) ; commentaire parent d'un autre post ; suppression par quelqu'un qui n'est ni l'auteur du commentaire ni celui du post |
    | `reply_to_reply` | 422 | Réponse à une réponse (un seul niveau de réponse) |
    | `cannot_block_self` | 422 | Se bloquer ou se débloquer soi-même |
    | `cannot_report_self` | 422 | Se signaler soi-même ou signaler son propre post ou commentaire |
    | `admin_required` | 403 | Route d'administration (`/v1/admin/…`) appelée par un compte sans rôle `admin` (ADR-011) |
    | `invalid_status_transition` | 409 | Le statut actuel du compte ne permet pas l'action d'administration (ex. suspendre un compte banni) |
    | `cannot_moderate_self` | 422 | Un admin ne peut ni se suspendre, ni se bannir, ni se réactiver, ni se supprimer lui-même |
    | `plus_required` | 403 | Avantage réservé à Clone Plus demandé sans abonnement actif (ADR-012) ; aucune route P0 ne le renvoie encore |

    Pagination : `?cursor=` (valeur opaque de `nextCursor`) ; réponse `{ items, nextCursor }`, `nextCursor` absent sur la dernière page (ADR-007).
servers:
  - url: /
    description: Même origine ; l'hôte dépend de l'environnement (local ou démo, ADR-009).
security:
  - bearerAuth: []
tags:
  - name: system
    description: Supervision de l'API
  - name: identity
    description: Profil de l'utilisateur authentifié, onboarding, usernames
  - name: media
    description: Upload présigné et traitement des médias (ADR-008)
  - name: users
    description: Profils des autres utilisateurs, selon la politique de visibilité (ADR-006)
  - name: social
    description: Abonnements, listes d'abonnés et recherche d'utilisateurs (ADR-006)
  - name: posts
    description: Publication et lecture des posts, selon la politique de visibilité (ADR-006)
  - name: feed
    description: Feed d'accueil chronologique (ADR-007), selon la politique de visibilité (ADR-006)
  - name: engagement
    description: Likes et commentaires des posts, selon la politique de visibilité (ADR-006)
  - name: billing
    description: Abonnement Clone Plus, vérifié par l'API auprès de RevenueCat (ADR-012)
  - name: moderation
    description: Signalements de contenus et de comptes
  - name: admin
    description: Administration depuis le backoffice (ADR-011) ; rôle `admin` requis, chaque action écrite dans le journal d'audit
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: État de l'API (liveness)
      description: Répond sans interroger Postgres ni Redis. Sans authentification.
      security: []
      responses:
        '200':
          description: L'API répond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Mon profil
      description: Profil de l'utilisateur authentifié, dont sa date de naissance et le statut du compte. `404 profile_not_found` tant que l'onboarding n'est pas terminé. Répond aussi pour un compte suspendu ou banni (l'app affiche alors l'écran « Compte suspendu », ADR-005).
      responses:
        '200':
          description: Mon profil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateMe
      tags: [identity]
      summary: Modifier mon profil
      description: Modifie le nom, la bio, le username ou la photo de profil. Seuls les champs présents sont modifiés ; une bio vide efface la bio. `avatarMediaId` désigne un média `ready`, à moi, de `purpose` `avatar`, jamais utilisé ; l'ancienne photo est détachée puis purgée (ADR-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Profil modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Onboarding non terminé (`profile_not_found`) ou média introuvable (`media_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Username déjà utilisé (`username_taken`), média pas encore prêt (`media_not_ready`) ou déjà utilisé (`media_already_attached`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Média prévu pour un autre usage (`media_purpose_mismatch`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMe
      tags: [identity]
      summary: Supprimer mon compte
      description: |
        Suppression réelle du compte (ADR-007) : l'accès est coupé immédiatement (utilisateur Supabase Auth supprimé, toute requête portant un JWT encore valide de ce compte → `401 unauthenticated`), puis le job `purge-account` efface données, fichiers, abonnement, client RevenueCat et personne PostHog (ADR-008).
        Possible aussi pour un compte suspendu ou banni (ADR-005). Ne résilie pas l'abonnement Apple (ADR-012). Profil inexistant ou déjà purgé → `404 profile_not_found`.
      responses:
        '204':
          description: Compte supprimé ; la purge suit.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/avatar:
    delete:
      operationId: removeAvatar
      tags: [identity]
      summary: Retirer ma photo de profil
      description: Retire la photo de profil ; l'ancien média est détaché puis purgé (ADR-008). Sans photo, ne change rien.
      responses:
        '200':
          description: Profil sans photo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/settings:
    patch:
      operationId: updateSettings
      tags: [identity]
      summary: Modifier mes paramètres
      description: Passe mon compte en privé ou en public. Passer en privé conserve mes abonnés ; seuls eux voient ensuite mes contenus (ADR-006).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: Profil avec les paramètres modifiés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/blocks:
    get:
      operationId: listBlocks
      tags: [social]
      summary: Comptes que j'ai bloqués
      description: |
        Comptes que j'ai bloqués, blocage le plus récent en premier, par pages de 20. Les comptes non actifs n'apparaissent pas. `relationship` vaut toujours `false` / `false` (bloquer supprime les abonnements).
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de comptes bloqués.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/subscription/refresh:
    post:
      operationId: refreshSubscription
      tags: [billing]
      summary: Rafraîchir mon abonnement Clone Plus
      description: |
        Relit mon abonnement auprès de RevenueCat (ADR-012) : appelé après un achat, une restauration et au lancement de l'app. Sans corps.

        - Abonnement `plus` actif rafraîchi il y a moins de 5 minutes : aucun appel à RevenueCat, statut enregistré renvoyé.
        - Plan `free` : RevenueCat est toujours appelé (un achat récent doit être vu tout de suite).
        - RevenueCat injoignable : dernier statut connu renvoyé.
      responses:
        '200':
          description: Mon plan après rafraîchissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/onboarding:
    post:
      operationId: completeOnboarding
      tags: [identity]
      summary: Créer mon profil (fin de l'onboarding)
      description: Appelé à l'acceptation des conditions (ADR-018). Crée le profil de l'utilisateur authentifié.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOnboardingRequest'
      responses:
        '201':
          description: Profil créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: Username déjà utilisé (`username_taken`) ou profil déjà créé (`profile_already_exists`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Moins de 13 ans (`age_requirement_not_met`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/usernames/{username}/availability:
    get:
      operationId: getUsernameAvailability
      tags: [identity]
      summary: Disponibilité d'un username
      description: Vérifiée en direct pendant l'onboarding. Si le username est pris, jusqu'à 3 usernames libres dérivés du candidat sont suggérés. Un username au mauvais format est refusé en `400`. Le username de l'appelant lui-même est disponible pour lui.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Username'
      responses:
        '200':
          description: Disponibilité du username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailability'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/users/{username}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Profil d'un utilisateur
      description: |
        Profil public d'un utilisateur et sa relation avec l'appelant. Un profil inexistant, bloqué dans un sens ou dans l'autre, ou dont le compte n'est pas actif renvoie `404 user_not_found`, jamais `403` (ADR-006).
        Un compte privé non suivi reste visible (en-tête, compteurs, bio) avec `canViewContent: false`. L'appelant peut lire son propre profil ; l'app utilise `GET /v1/me` pour le sien.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Username'
      responses:
        '200':
          description: Le profil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/users/{id}/follow:
    put:
      operationId: followUser
      tags: [social]
      summary: Suivre un utilisateur
      description: |
        Idempotent : suivre un compte déjà suivi renvoie `200` sans changer les compteurs. Refusé vers un compte privé non suivi (`403 account_private`, demandes d'abonnement en P1).
        Compte inexistant, bloqué dans un sens ou dans l'autre, ou non actif : `404 user_not_found` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: J'ai suivi ce compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowStatus'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Compte privé (`account_private`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Compte introuvable ou invisible (`user_not_found`), ou onboarding non terminé (`profile_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/CannotFollowSelf'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: unfollowUser
      tags: [social]
      summary: Ne plus suivre un utilisateur
      description: |
        Idempotent : sans abonnement, renvoie `200` sans changer les compteurs. Possible vers un compte privé. Compte inexistant ou invisible : `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Je ne suis plus ce compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowStatus'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          $ref: '#/components/responses/CannotFollowSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/users/{id}/block:
    put:
      operationId: blockUser
      tags: [social]
      summary: Bloquer un utilisateur
      description: |
        Supprime les abonnements dans les deux sens (compteurs mis à jour) ; les deux comptes deviennent ensuite mutuellement invisibles (ADR-006). Idempotent : bloquer un compte déjà bloqué renvoie `204` sans effet.
        Compte inexistant, qui m'a bloqué, ou non actif : `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Compte bloqué.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Compte introuvable ou invisible (`user_not_found`), ou onboarding non terminé (`profile_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/CannotBlockSelf'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: unblockUser
      tags: [social]
      summary: Débloquer un utilisateur
      description: |
        Idempotent : débloquer un compte non bloqué renvoie `204` sans effet. Les abonnements supprimés au blocage ne sont pas rétablis. Compte inexistant : `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Compte débloqué.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          $ref: '#/components/responses/CannotBlockSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/users/{id}/followers:
    get:
      operationId: listFollowers
      tags: [social]
      summary: Abonnés d'un utilisateur
      description: |
        Comptes qui suivent cet utilisateur, abonnement le plus récent en premier, par pages de 20. Réservé à qui peut voir ses contenus (compte public, soi-même ou abonné) ; sinon `404 user_not_found`.
        Les comptes bloqués dans un sens ou dans l'autre avec l'appelant et les comptes non actifs n'apparaissent pas.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page d'abonnés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/users/{id}/following:
    get:
      operationId: listFollowing
      tags: [social]
      summary: Abonnements d'un utilisateur
      description: |
        Comptes suivis par cet utilisateur, abonnement le plus récent en premier, par pages de 20. Mêmes règles de visibilité que `GET /v1/users/{id}/followers`.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page d'abonnements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/users/{id}/posts:
    get:
      operationId: listUserPosts
      tags: [posts]
      summary: Posts d'un utilisateur
      description: |
        Posts non supprimés de cet utilisateur, du plus récent au plus ancien, par pages de 12 (grille du profil). Réservé à qui peut voir ses contenus (compte public, soi-même ou abonné) ; sinon `404 user_not_found` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de posts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/posts:
    post:
      operationId: createPost
      tags: [posts]
      summary: Publier un post
      description: |
        Crée un post à partir de médias `ready`, à moi, de `purpose` `post`, jamais utilisés (ADR-008) ; ils sont rattachés au post dans l'ordre de `mediaIds`.
        De 1 à 10 images (carrousel) ; les reels arrivent en P1. Limité à 20 posts par heure (`429 rate_limited`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post publié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Onboarding non terminé (`profile_not_found`) ou média introuvable (`media_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Média pas encore prêt (`media_not_ready`) ou déjà utilisé (`media_already_attached`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Média prévu pour un autre usage (`media_purpose_mismatch`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Détail d'un post
      description: Post inexistant, supprimé, ou dont l'auteur est invisible pour l'appelant (blocage, compte non actif, compte privé non suivi) → `404 post_not_found`, jamais `403` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Le post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Supprimer un de mes posts
      description: |
        Suppression logique par l'auteur (ADR-007) : le post disparaît de toutes les lectures, `postCount` baisse de 1 et ses médias sont détachés, puis purgés par `purge-orphan-media` (ADR-008).
        Post inexistant, déjà supprimé, invisible ou d'un autre auteur → `404 post_not_found`, jamais `403` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Post supprimé.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/posts/{id}/like:
    put:
      operationId: likePost
      tags: [engagement]
      summary: Aimer un post
      description: |
        Idempotent : aimer un post déjà aimé renvoie `200` sans changer `likeCount`. On peut aimer son propre post.
        Post inexistant, supprimé, ou dont l'auteur est invisible pour l'appelant (blocage, compte non actif, compte privé non suivi) → `404 post_not_found`, jamais `403` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: J'aime ce post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeStatus'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/LikeTargetNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: unlikePost
      tags: [engagement]
      summary: Ne plus aimer un post
      description: |
        Idempotent : sans like, renvoie `200` sans changer `likeCount`.
        Post inexistant, supprimé ou invisible pour l'appelant → `404 post_not_found`, comme pour `likePost` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Je n'aime plus ce post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeStatus'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/LikeTargetNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/posts/{id}/comments:
    get:
      operationId: listComments
      tags: [engagement]
      summary: Commentaires d'un post
      description: |
        Commentaires de premier niveau non supprimés, du plus récent au plus ancien, par pages de 20. Commentaires des auteurs bloqués dans un sens ou dans l'autre et des comptes non actifs absents (ADR-006).
        Post inexistant, supprimé ou invisible pour l'appelant → `404 post_not_found`.
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de commentaires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createComment
      tags: [engagement]
      summary: Commenter un post ou répondre à un commentaire
      description: |
        Corps de 1 à 2 200 caractères, sans espaces en début ni en fin (retirés). Avec `parentId`, répond à un commentaire de premier niveau de ce post (un seul niveau de réponse).
        `commentCount` du post augmente de 1 (réponses comprises) ; `replyCount` du parent aussi pour une réponse. Limité à 30 commentaires par minute (`429 rate_limited`).
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Commentaire publié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Post inexistant, supprimé ou invisible (`post_not_found`), commentaire parent inexistant, supprimé, invisible ou d'un autre post (`comment_not_found`), ou onboarding non terminé (`profile_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Réponse à une réponse (`reply_to_reply`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/comments/{id}/replies:
    get:
      operationId: listReplies
      tags: [engagement]
      summary: Réponses à un commentaire
      description: |
        Réponses non supprimées, du plus récent au plus ancien, par pages de 20. Réponses des auteurs bloqués dans un sens ou dans l'autre et des comptes non actifs absentes (ADR-006).
        Commentaire inexistant, supprimé, ou dont le post ou l'auteur est invisible pour l'appelant → `404 comment_not_found`.
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de réponses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CommentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/comments/{id}:
    delete:
      operationId: deleteComment
      tags: [engagement]
      summary: Supprimer un commentaire
      description: |
        Suppression logique (ADR-007) par l'auteur du commentaire ou par l'auteur du post. Supprimer un commentaire supprime ses réponses : `commentCount` du post baisse de 1 + nombre de réponses supprimées ; supprimer une réponse baisse aussi `replyCount` de son parent.
        Commentaire inexistant, déjà supprimé, invisible, ou supprimé par quelqu'un d'autre → `404 comment_not_found`, jamais `403` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '204':
          description: Commentaire supprimé.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CommentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Feed d'accueil
      description: |
        Posts non supprimés des comptes que je suis et les miens, du plus récent au plus ancien, par pages de 12 (comme Instagram). Auteurs bloqués dans un sens ou dans l'autre et comptes non actifs exclus (ADR-006, ADR-007). Sans abonnement ni post, la liste est vide.
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page du feed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/search/users:
    get:
      operationId: searchUsers
      tags: [social]
      summary: Rechercher des utilisateurs
      description: |
        Correspondance partielle sur le username ou le nom, insensible à la casse ; `q` est nettoyé (espaces en début et en fin, `@` initial). 30 résultats au plus, sans pagination.
        Tri : username exact, username qui commence par `q`, comptes suivis, similarité, nombre d'abonnés. Comptes bloqués dans un sens ou dans l'autre et comptes non actifs absents ; comptes privés présents (ADR-006).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: Comptes trouvés (liste vide si aucun).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResults'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports:
    post:
      operationId: createReport
      tags: [moderation]
      summary: Signaler un post, un commentaire ou un compte
      description: |
        Crée un signalement `open`, traité ensuite depuis le backoffice. Un même contenu peut être signalé plusieurs fois. `details` (motif `other` surtout) est enregistré sans espaces en début ni en fin ; vide, il est ignoré.
        Cible inexistante, supprimée ou invisible pour l'appelant (ADR-006) : `404 post_not_found`, `comment_not_found` ou `user_not_found`. Limité à 10 signalements par heure (`429 rate_limited`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Signalement enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Cible introuvable ou invisible (`post_not_found`, `comment_not_found`, `user_not_found`), ou onboarding non terminé (`profile_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Signalement de soi-même ou de son propre contenu (`cannot_report_self`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/media/uploads:
    post:
      operationId: requestMediaUpload
      tags: [media]
      summary: Demander une intention d'upload
      description: |
        Crée le média en `pending_upload` et renvoie une URL d'upload présignée (ADR-008).
        Le fichier est envoyé directement à `uploadUrl` par un `PUT` du contenu brut, avec le `Content-Type` déclaré, avant `expiresAt` ;
        l'API ne transporte jamais le fichier. Image JPEG ou PNG de 20 Mo au plus, pour une photo de profil (`avatar`) ou un post (`post`).
        Limité à 30 demandes par heure (`429 rate_limited`, ADR-005).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
      responses:
        '201':
          description: Intention d'upload créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadIntent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/media/{id}/complete:
    post:
      operationId: completeMediaUpload
      tags: [media]
      summary: Confirmer l'envoi du fichier
      description: Passe le média de `pending_upload` à `uploaded` et lance son traitement. Rappelé sur un média déjà `uploaded`, relance le traitement sans doublon.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Média en attente de traitement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          description: Média déjà en traitement, prêt ou en échec (`media_invalid_transition`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/media/{id}:
    get:
      operationId: getMedia
      tags: [media]
      summary: Statut d'un de mes médias
      description: Statut et variantes d'un média, pour son seul propriétaire. L'app interroge cette route jusqu'à `ready` ou `failed`.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Le média.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/me:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Ma session d'administration
      description: Vérifie que l'utilisateur authentifié a le rôle `admin` (connexion au backoffice, puis chaque page et chaque action). Un admin n'a pas besoin de profil.
      responses:
        '200':
          description: L'appelant est admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Rechercher des utilisateurs
      description: |
        Comptes du plus récent au plus ancien, par pages de 20 (comptes supprimés exclus). `q` filtre par correspondance partielle sur le username ou le nom, insensible à la casse (sans espaces superflus ni `@` initial) ; `status` filtre par statut.
      parameters:
        - name: q
          in: query
          required: false
          description: Username ou nom, partiel ; 1 à 30 caractères après suppression des espaces et du `@` initial.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de comptes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/users/{id}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Fiche d'un utilisateur
      description: Profil, statut, compteurs, abonnement Clone Plus, et les 20 signalements reçus (compte, ses posts, ses commentaires) et émis les plus récents, avec leur total. Compte inexistant ou supprimé → `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: La fiche.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Supprimer un compte
      description: |
        Même suppression que `DELETE /v1/me` : utilisateur Supabase Auth supprimé (accès coupé), profil supprimé, puis purge des données et fichiers. Motif obligatoire, écrit dans le journal d'audit.
        Compte inexistant ou déjà supprimé → `404 user_not_found` ; Supabase Auth injoignable → `500`, compte intact.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '204':
          description: Compte supprimé ; la purge suit.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          $ref: '#/components/responses/CannotModerateSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/users/{id}/suspend:
    post:
      operationId: suspendAdminUser
      tags: [admin]
      summary: Suspendre un compte
      description: |
        Compte `active` → `suspended` : toute route lui est refusée sauf `GET /v1/me` et `DELETE /v1/me` (`403 account_suspended`) ; son profil et ses contenus deviennent invisibles (ADR-006).
        Motif obligatoire, écrit dans le journal d'audit. Autre statut → `409 invalid_status_transition` ; compte inexistant ou supprimé → `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Compte avec son nouveau statut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: Le statut actuel ne permet pas cette action (`invalid_status_transition`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/CannotModerateSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/users/{id}/ban:
    post:
      operationId: banAdminUser
      tags: [admin]
      summary: Bannir un compte
      description: |
        Compte `active` ou `suspended` → `banned`. Mêmes effets qu'une suspension (ADR-005).
        Motif obligatoire, écrit dans le journal d'audit. Autre statut → `409 invalid_status_transition` ; compte inexistant ou supprimé → `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Compte avec son nouveau statut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: Le statut actuel ne permet pas cette action (`invalid_status_transition`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/CannotModerateSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/users/{id}/reactivate:
    post:
      operationId: reactivateAdminUser
      tags: [admin]
      summary: Réactiver un compte
      description: |
        Compte `suspended` ou `banned` → `active` : accès et visibilité rétablis.
        Motif obligatoire, écrit dans le journal d'audit. Autre statut → `409 invalid_status_transition` ; compte inexistant ou supprimé → `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Compte avec son nouveau statut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: Le statut actuel ne permet pas cette action (`invalid_status_transition`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/CannotModerateSelf'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Supabase Auth.
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Username:
      type: string
      description: 1 à 30 caractères `[a-z0-9._]`, en minuscules (ADR-007).
      minLength: 1
      maxLength: 30
      pattern: '^[a-z0-9._]{1,30}$'
      examples: ['killian.b']
    FullName:
      type: string
      description: Nom affiché, 1 à 30 caractères, au moins un caractère autre qu'un espace.
      minLength: 1
      maxLength: 30
      pattern: '\S'
      examples: ['Killian Boularand']
    Bio:
      type: string
      description: 150 caractères au plus ; chaîne vide si aucune bio.
      maxLength: 150
    AccountStatus:
      type: string
      enum: [active, suspended, banned]
    Me:
      type: object
      description: Profil de l'utilisateur authentifié.
      required:
        [
          id,
          username,
          fullName,
          bio,
          birthDate,
          isPrivate,
          status,
          followerCount,
          followingCount,
          postCount,
          plan,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant Supabase Auth.
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        bio:
          $ref: '#/components/schemas/Bio'
        birthDate:
          type: string
          format: date
          description: Renvoyée à son seul propriétaire.
        isPrivate:
          type: boolean
        status:
          $ref: '#/components/schemas/AccountStatus'
        followerCount:
          type: integer
          minimum: 0
        followingCount:
          type: integer
          minimum: 0
        postCount:
          type: integer
          minimum: 0
        avatar:
          $ref: '#/components/schemas/ImageVariants'
          description: Photo de profil ; absente si aucune photo.
        plan:
          $ref: '#/components/schemas/Plan'
        plusExpiresAt:
          type: string
          format: date-time
          description: Fin de la période payée de Clone Plus ; absente si le plan est `free`.
        createdAt:
          type: string
          format: date-time
    Plan:
      type: string
      description: Plan de l'utilisateur selon l'API (règle `isPlus`, ADR-012) ; seul ce plan débloque un avantage dans l'app.
      enum: [free, plus]
    SubscriptionStatus:
      type: object
      description: Mon plan Clone Plus.
      required: [plan]
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        expiresAt:
          type: string
          format: date-time
          description: Fin de la période payée ; absente si le plan est `free`.
    CompleteOnboardingRequest:
      type: object
      additionalProperties: false
      required: [username, fullName, birthDate]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        birthDate:
          type: string
          format: date
          examples: ['2000-01-31']
    UpdateMeRequest:
      type: object
      description: Au moins un champ.
      additionalProperties: false
      minProperties: 1
      properties:
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        bio:
          $ref: '#/components/schemas/Bio'
        avatarMediaId:
          type: string
          format: uuid
          description: Nouvelle photo de profil ; le retrait passe par `DELETE /v1/me/avatar`.
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      required: [isPrivate]
      properties:
        isPrivate:
          type: boolean
          description: Compte privé (`true`) ou public (`false`).
    UsernameAvailability:
      type: object
      required: [username, available, suggestions]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        available:
          type: boolean
        suggestions:
          type: array
          description: Vide si le username est disponible ; sinon jusqu'à 3 usernames libres.
          maxItems: 3
          items:
            $ref: '#/components/schemas/Username'
    UserProfile:
      type: object
      description: Profil public d'un utilisateur, vu par l'appelant (sans date de naissance ni statut).
      required:
        [
          id,
          username,
          fullName,
          bio,
          isPrivate,
          followerCount,
          followingCount,
          postCount,
          relationship,
          canViewContent,
        ]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        bio:
          $ref: '#/components/schemas/Bio'
        isPrivate:
          type: boolean
        followerCount:
          type: integer
          minimum: 0
        followingCount:
          type: integer
          minimum: 0
        postCount:
          type: integer
          minimum: 0
        avatar:
          $ref: '#/components/schemas/ImageVariants'
          description: Photo de profil ; absente si aucune photo.
        relationship:
          $ref: '#/components/schemas/Relationship'
        canViewContent:
          type: boolean
          description: L'appelant peut voir les contenus (posts) ; `false` pour un compte privé qu'il ne suit pas (ADR-006).
    Relationship:
      type: object
      description: Relation entre l'appelant et le profil ; les deux valeurs sont `false` sur son propre profil.
      required: [following, followedBy]
      properties:
        following:
          type: boolean
          description: L'appelant suit ce profil.
        followedBy:
          type: boolean
          description: Ce profil suit l'appelant.
    UserSummary:
      type: object
      description: Compte dans une liste ou un résultat de recherche, vu par l'appelant.
      required: [id, username, fullName, isPrivate, relationship]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        isPrivate:
          type: boolean
        avatar:
          $ref: '#/components/schemas/ImageVariants'
          description: Photo de profil ; absente si aucune photo.
        relationship:
          $ref: '#/components/schemas/Relationship'
    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/UserSummary'
        nextCursor:
          type: string
          description: Curseur de la page suivante ; absent sur la dernière page.
    UserSearchResults:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/UserSummary'
    FollowStatus:
      type: object
      description: Relation après l'action, et compteur d'abonnés du compte suivi.
      required: [following, followerCount]
      properties:
        following:
          type: boolean
          description: L'appelant suit ce compte.
        followerCount:
          type: integer
          minimum: 0
    ImageVariants:
      type: object
      description: URL publiques des variantes WebP d'une image (ADR-008).
      required: [thumb, medium, large]
      properties:
        thumb:
          type: string
          format: uri
          description: 150 px de large.
        medium:
          type: string
          format: uri
          description: 640 px de large.
        large:
          type: string
          format: uri
          description: 1080 px de large.
    MediaKind:
      type: string
      description: '`video` arrive avec les reels (P1).'
      enum: [image]
    MediaPurpose:
      type: string
      description: Usage prévu du média ; il ne peut être rattaché qu'à cet usage (ADR-008).
      enum: [avatar, post]
    MediaStatus:
      type: string
      description: '`pending_upload` → `uploaded` → `processing` → `ready` | `failed` (ADR-008).'
      enum: [pending_upload, uploaded, processing, ready, failed]
    MediaFailureReason:
      type: string
      description: |
        - `invalid_image` : le fichier n'est pas une image JPEG ou PNG ;
        - `file_too_large` : plus de 20 Mo ;
        - `processing_error` : échec du traitement après ses tentatives.
      enum: [invalid_image, file_too_large, processing_error]
    MediaUploadRequest:
      type: object
      additionalProperties: false
      required: [kind, purpose, mimeType, sizeBytes]
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        mimeType:
          type: string
          enum: [image/jpeg, image/png]
        sizeBytes:
          type: integer
          description: Taille déclarée du fichier ; le worker revérifie le fichier réel.
          minimum: 1
          maximum: 20971520
    MediaUploadIntent:
      type: object
      required: [mediaId, uploadUrl, expiresAt]
      properties:
        mediaId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: URL présignée ; `PUT` du contenu brut du fichier.
        expiresAt:
          type: string
          format: date-time
    Media:
      type: object
      description: Un de mes médias.
      required: [id, kind, purpose, status]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MediaKind'
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        status:
          $ref: '#/components/schemas/MediaStatus'
        variants:
          $ref: '#/components/schemas/ImageVariants'
          description: Présentes quand le média est `ready`.
        failureReason:
          $ref: '#/components/schemas/MediaFailureReason'
          description: Présent quand le média est `failed`.
    PostKind:
      type: string
      description: '`reel` arrive en P1.'
      enum: [post]
    Caption:
      type: string
      description: Légende, 2 200 caractères au plus ; chaîne vide si aucune légende.
      maxLength: 2200
    CreatePostRequest:
      type: object
      additionalProperties: false
      required: [kind, mediaIds]
      properties:
        kind:
          $ref: '#/components/schemas/PostKind'
        caption:
          $ref: '#/components/schemas/Caption'
        mediaIds:
          type: array
          description: Médias du post, dans l'ordre d'affichage (1 à 10 images).
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
    PostAuthor:
      type: object
      description: Auteur d'un post.
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
        avatar:
          $ref: '#/components/schemas/ImageVariants'
          description: Photo de profil ; absente si aucune photo.
    PostMedia:
      type: object
      description: Une image d'un post ; `width` et `height` (en pixels) donnent son ratio d'affichage.
      required: [variants, width, height]
      properties:
        variants:
          $ref: '#/components/schemas/ImageVariants'
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    Post:
      type: object
      required:
        [id, kind, caption, author, media, likeCount, viewerHasLiked, commentCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PostKind'
        caption:
          $ref: '#/components/schemas/Caption'
        author:
          $ref: '#/components/schemas/PostAuthor'
        media:
          type: array
          description: Médias dans l'ordre d'affichage.
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/PostMedia'
        likeCount:
          type: integer
          minimum: 0
        viewerHasLiked:
          type: boolean
          description: L'appelant aime ce post.
        commentCount:
          type: integer
          minimum: 0
          description: Nombre de commentaires non supprimés, réponses comprises.
        createdAt:
          type: string
          format: date-time
    PostPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/Post'
        nextCursor:
          type: string
          description: Curseur de la page suivante ; absent sur la dernière page.
    LikeStatus:
      type: object
      description: État du like après l'action, et nombre de likes du post.
      required: [liked, likeCount]
      properties:
        liked:
          type: boolean
          description: L'appelant aime ce post.
        likeCount:
          type: integer
          minimum: 0
    CommentBody:
      type: string
      description: Texte du commentaire, 2 200 caractères au plus, avec au moins un caractère visible ; espaces de début et de fin retirés.
      minLength: 1
      maxLength: 2200
      pattern: '\S'
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          $ref: '#/components/schemas/CommentBody'
        parentId:
          type: string
          format: uuid
          description: Commentaire de premier niveau de ce post auquel on répond ; absent pour un commentaire de premier niveau.
    Comment:
      type: object
      description: Commentaire ou réponse, vu par l'appelant.
      required: [id, postId, author, body, replyCount, createdAt, viewerCanDelete]
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          description: Commentaire auquel celui-ci répond ; absent pour un commentaire de premier niveau.
        author:
          $ref: '#/components/schemas/PostAuthor'
        body:
          $ref: '#/components/schemas/CommentBody'
        replyCount:
          type: integer
          minimum: 0
          description: Nombre de réponses non supprimées ; toujours 0 pour une réponse.
        createdAt:
          type: string
          format: date-time
        viewerCanDelete:
          type: boolean
          description: L'appelant peut supprimer ce commentaire (il en est l'auteur, ou l'auteur du post).
    CommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Comment'
        nextCursor:
          type: string
          description: Curseur de la page suivante ; absent sur la dernière page.
    ProblemDetails:
      type: object
      description: Erreur au format Problem Details (RFC 9457).
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifiant du type de problème (`about:blank` par défaut).
          examples: ['about:blank']
        title:
          type: string
          description: Résumé lisible du statut HTTP.
          examples: ['Not Found']
        status:
          type: integer
          minimum: 100
          maximum: 599
          examples: [404]
        detail:
          type: string
          description: Explication lisible de cette occurrence.
        code:
          type: string
          description: Code stable, destiné au client (ex. `validation_failed`, `username_taken`).
          examples: ['route_not_found']
    ReportTargetType:
      type: string
      description: Type de contenu signalé (stories et messages en P1).
      enum: [post, comment, user]
    ReportReason:
      type: string
      description: Motif du signalement.
      enum: [spam, nudity, harassment, violence, hate, other]
    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, reason]
      properties:
        targetType:
          $ref: '#/components/schemas/ReportTargetType'
        targetId:
          type: string
          format: uuid
          description: Identifiant du post, du commentaire ou du compte signalé.
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type: string
          maxLength: 500
          description: Précisions facultatives, 500 caractères au plus.
    ReportCreated:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    AdminSession:
      type: object
      description: Utilisateur authentifié qui a le rôle `admin`.
      required: [id, role]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant Supabase Auth.
        role:
          type: string
          enum: [admin]
    AdminActionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: Motif de l'action, 500 caractères au plus, avec au moins un caractère visible ; espaces de début et de fin retirés.
          minLength: 1
          maxLength: 500
          pattern: '\S'
    AdminUserSummary:
      type: object
      description: Compte vu par un admin.
      required:
        [id, username, fullName, status, followerCount, followingCount, postCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        status:
          $ref: '#/components/schemas/AccountStatus'
        avatar:
          $ref: '#/components/schemas/ImageVariants'
          description: Photo de profil ; absente si aucune photo.
        followerCount:
          type: integer
          minimum: 0
        followingCount:
          type: integer
          minimum: 0
        postCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    AdminUserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        nextCursor:
          type: string
          description: Curseur de la page suivante ; absent sur la dernière page.
    AdminReportStatus:
      type: string
      enum: [open, resolved_removed, resolved_dismissed]
    AdminReport:
      type: object
      description: Signalement vu par un admin.
      required: [id, targetType, targetId, reason, status, reporter, createdAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/ReportTargetType'
        targetId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type: string
        status:
          $ref: '#/components/schemas/AdminReportStatus'
        reporter:
          $ref: '#/components/schemas/PostAuthor'
        createdAt:
          type: string
          format: date-time
    AdminReportList:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          description: Les 20 plus récents.
          maxItems: 20
          items:
            $ref: '#/components/schemas/AdminReport'
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          description: Fiche d'un compte vue par un admin.
          required: [bio, isPrivate, plan, reportsReceived, reportsFiled]
          properties:
            bio:
              $ref: '#/components/schemas/Bio'
            isPrivate:
              type: boolean
            plan:
              $ref: '#/components/schemas/Plan'
            plusExpiresAt:
              type: string
              format: date-time
              description: Fin de la période payée de Clone Plus ; absente si le plan est `free`.
            reportsReceived:
              $ref: '#/components/schemas/AdminReportList'
              description: Signalements visant le compte, ses posts ou ses commentaires.
            reportsFiled:
              $ref: '#/components/schemas/AdminReportList'
              description: Signalements émis par le compte.
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Valeur de `nextCursor` de la page précédente ; opaque.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    MediaId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationFailed:
      description: Entrée non conforme au schéma (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthenticated:
      description: JWT absent ou invalide (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProfileNotFound:
      description: Onboarding non terminé (`profile_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    MediaNotFound:
      description: Média inexistant ou d'un autre utilisateur (`media_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InvalidInput:
      description: Entrée non conforme au schéma (`validation_failed`) ou curseur invalide (`invalid_cursor`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CannotFollowSelf:
      description: On ne peut pas se suivre soi-même (`cannot_follow_self`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CannotBlockSelf:
      description: On ne peut pas se bloquer soi-même (`cannot_block_self`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UserNotFound:
      description: Profil inexistant ou invisible pour l'appelant (`user_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PostNotFound:
      description: Post inexistant, supprimé ou invisible pour l'appelant (`post_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    LikeTargetNotFound:
      description: Post inexistant, supprimé ou invisible pour l'appelant (`post_not_found`), ou onboarding non terminé (`profile_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CommentNotFound:
      description: Commentaire inexistant, supprimé ou invisible pour l'appelant (`comment_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AdminForbidden:
      description: Rôle `admin` requis (`admin_required`) ou compte suspendu (`account_suspended`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CannotModerateSelf:
      description: Un admin ne peut pas se viser lui-même (`cannot_moderate_self`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimited:
      description: Trop de requêtes (`rate_limited`) ; réessayer après `Retry-After` secondes.
      headers:
        Retry-After:
          description: Délai avant de réessayer, en secondes.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: Erreur inattendue (`internal_error`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
