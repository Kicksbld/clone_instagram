# Redis de dev : file de jobs BullMQ uniquement (ADR-008, ADR-009).
# Postgres, Auth et Storage viennent de la CLI Supabase (`supabase start`).
services:
  redis:
    image: redis:8-alpine
    # BullMQ exige qu'aucune clé ne soit évincée.
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
