# Build et tests de l'app iOS sur un runner macOS (gratuit : dépôt public). Complète la vérification locale
# (`ios/scripts/test.sh`, ADR-014) pour le code écrit sans Mac. Lancé quand `ios/` change.
name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode le plus récent
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator

      - name: Outils (xcodegen, swiftlint, swiftformat)
        run: brew bundle --file Brewfile

      - name: Configurations locales depuis les modèles
        run: |
          for name in Local Demo; do
            cp "CloneInstagram/Resources/Config/$name.example.xcconfig" "CloneInstagram/Resources/Config/$name.xcconfig"
          done

      # Comme la phase de build du projet : SwiftLint bloque, SwiftFormat avertit (sa version Homebrew peut
      # être plus récente que celle du poste du lead dev et signaler du code existant).
      - name: Lint
        run: |
          swiftlint lint --quiet
          swiftformat --lint . || echo "::warning::SwiftFormat signale des fichiers à reformater (voir ci-dessus)"

      - name: Tests
        run: |
          device="$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)"
          echo "Simulateur : $device"
          CLONE_IOS_DESTINATION="platform=iOS Simulator,name=$device" scripts/test.sh

      - name: Journal complet
        if: failure()
        run: |
          log="$(ls -d "$HOME"/Library/Developer/Xcode/DerivedData/CloneInstagram-*/last-test.log 2>/dev/null | head -1)"
          if [ -n "$log" ]; then
            grep -nE "error:|warning: .*(Sendable|actor)" "$log" | head -200 || true
            tail -200 "$log"
          fi

      - name: Diagnostics Xcode
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: |
            ~/Library/Developer/Xcode/DerivedData/CloneInstagram-*/last-test.log
            ~/Library/Developer/Xcode/DerivedData/CloneInstagram-*/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: warn
