  /v1/posts:
    post:
      operationId: createPost
      tags: [posts]
      summary: Publier un post
      description: |
        Crée un post à partir de médias `ready`, à moi, de `purpose` `post`, jamais utilisés (ADR-008) ; ils sont rattachés au post dans l'ordre de `mediaIds`.
        De 1 à 10 images (carrousel), ou exactement une vidéo prête pour un reel. Un média de type incompatible renvoie `422 media_kind_mismatch`. Plus de 20 mentions distinctes renvoie `422 too_many_mentions`. Limité à 20 posts par heure (`429 rate_limited`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post publié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Onboarding non terminé (`profile_not_found`) ou média introuvable (`media_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Média pas encore prêt (`media_not_ready`) ou déjà utilisé (`media_already_attached`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Média prévu pour un autre usage (`media_purpose_mismatch`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Détail d'un post
      description: Post inexistant, supprimé, ou dont l'auteur est invisible pour l'appelant (blocage, compte non actif, compte privé non suivi) → `404 post_not_found`, jamais `403` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Le post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Supprimer un de mes posts
      description: |
        Suppression logique par l'auteur (ADR-007) : le post disparaît de toutes les lectures, `postCount` baisse de 1 et ses médias sont détachés, puis purgés par `purge-orphan-media` (ADR-008).
        Post inexistant, déjà supprimé, invisible ou d'un autre auteur → `404 post_not_found`, jamais `403` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Post supprimé.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updatePostCaption
      tags: [posts]
      summary: Modifier la légende d'un de mes posts
      description: |
        Seul l'auteur modifie la légende d'un post ou d'un reel ; `updated_at` est mis à jour. Les mentions sont recalculées dans la même transaction (ADR-025) : les nouvelles sont créées et notifiées (mêmes règles qu'à la publication), les retirées sont supprimées avec leur notification. Plus de 20 mentions distinctes renvoie `422 too_many_mentions`.
        Post inexistant, supprimé, invisible ou d'un autre auteur → `404 post_not_found`, jamais `403` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostCaptionRequest'
