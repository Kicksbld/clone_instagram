        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/stories/{id}/view:
    post:
      operationId: viewStory
      tags: [stories]
      summary: Enregistrer ma vue d'une story
      description: |
        Envoyé à l'affichage de la story. Une vue par compte : idempotent, la vue n'est comptée qu'une fois. Ma propre story n'est pas comptée (`204` sans effet).
        Story inexistante, supprimée, expirée ou invisible pour l'appelant → `404 story_not_found` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/StoryId'
      requestBody:
        required: true
        description: '`{}` pour une vue normale.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewStoryRequest'
      responses:
        '204':
          description: Vue enregistrée (ou déjà enregistrée).
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PlusRequired'
        '404':
          $ref: '#/components/responses/StoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/feed:
    get:
      operationId: getFeed
      tags: [feed]
