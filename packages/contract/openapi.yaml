        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reels/{id}/friend-interactions:
    get:
      operationId: listReelFriendInteractions
      tags: [feed]
      summary: Amis qui ont interagi avec un reel
      description: |
        Liste complète de mes amis (abonnés mutuels) qui ont créé, aimé ou commenté ce reel, interaction la plus récente en premier, avec les mêmes règles que `GET /v1/reels/friends` (ADR-029). Reel inexistant, supprimé, photo (`kind` `post`) ou invisible pour moi → `404 post_not_found`, jamais `403` (ADR-006).
