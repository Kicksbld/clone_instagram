          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PlusRequired'
        '404':
          $ref: '#/components/responses/StoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Feed d'accueil
      description: |
        Posts non supprimés des comptes que je suis et les miens, du plus récent au plus ancien, par pages de 12 (comme Instagram). Auteurs bloqués dans un sens ou dans l'autre et comptes non actifs exclus (ADR-006, ADR-007). Sans abonnement ni post, la liste est vide.
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page du feed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/search/users:
    get:
      operationId: searchUsers
      tags: [social]
      summary: Rechercher des utilisateurs
      description: |
        Correspondance partielle sur le username ou le nom, insensible à la casse ; `q` est nettoyé (espaces en début et en fin, `@` initial). 30 résultats au plus, sans pagination.
        Tri : username exact, username qui commence par `q`, comptes suivis, similarité, nombre d'abonnés. Comptes bloqués dans un sens ou dans l'autre et comptes non actifs absents ; comptes privés présents (ADR-006).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: Comptes trouvés (liste vide si aucun).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResults'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/reports:
    post:
      operationId: createReport
      tags: [moderation]
      summary: Signaler un post, un commentaire ou un compte
      description: |
        Crée un signalement `open`, traité ensuite depuis le backoffice. Un même contenu peut être signalé plusieurs fois. `details` (motif `other` surtout) est enregistré sans espaces en début ni en fin ; vide, il est ignoré.
        Cible inexistante, supprimée ou invisible pour l'appelant (ADR-006) : `404 post_not_found`, `comment_not_found` ou `user_not_found`. Limité à 10 signalements par heure (`429 rate_limited`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Signalement enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Cible introuvable ou invisible (`post_not_found`, `comment_not_found`, `user_not_found`), ou onboarding non terminé (`profile_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Signalement de soi-même ou de son propre contenu (`cannot_report_self`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/activity:
    get:
      operationId: getActivity
      tags: [activity]
      summary: Mon Activité
      description: |
        Notifications reçues, regroupées à la lecture (ADR-026) : les J'aime d'un même post forment un seul groupe (« léa et 1 autre ont aimé votre publication ») ; chaque commentaire, réponse ou abonnement forme son propre groupe. Groupes du plus récent au plus ancien (date de leur notification la plus récente), par pages de 20.
        Visibilité (ADR-006) : notifications des acteurs bloqués dans un sens ou dans l'autre ou non actifs absentes, ainsi que celles d'un post ou d'un commentaire supprimé ou devenu invisible.
        `unreadCount` : nombre de groupes contenant au moins une notification non lue (pastille du cœur), le même sur chaque page.
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de l'Activité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/activity/read:
    post:
      operationId: markActivityRead
      tags: [activity]
      summary: Tout marquer comme lu
      description: Marque comme lues toutes les notifications reçues ; `unreadCount` revient à 0. Idempotent.
      responses:
        '204':
          description: Notifications marquées comme lues.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/media/uploads:
    post:
      operationId: requestMediaUpload
      tags: [media]
      summary: Demander une intention d'upload
      description: |
        Crée le média en `pending_upload` et renvoie une URL d'upload présignée (ADR-008).
        Le fichier est envoyé directement à `uploadUrl` par un `PUT` du contenu brut, avec le `Content-Type` déclaré, avant `expiresAt` ;
        l'API ne transporte jamais le fichier. Image JPEG ou PNG de 20 Mo au plus pour `avatar` ou `post` ; vidéo MP4 de 50 Mo au plus pour `post`.
        Limité à 30 demandes par heure (`429 rate_limited`, ADR-005).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
      responses:
        '201':
          description: Intention d'upload créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadIntent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/media/{id}/complete:
    post:
      operationId: completeMediaUpload
      tags: [media]
      summary: Confirmer l'envoi du fichier
      description: Passe le média de `pending_upload` à `uploaded` et lance son traitement. Rappelé sur un média déjà `uploaded`, relance le traitement sans doublon.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Média en attente de traitement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          description: Média déjà en traitement, prêt ou en échec (`media_invalid_transition`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/media/{id}:
    get:
      operationId: getMedia
      tags: [media]
      summary: Statut d'un de mes médias
      description: Statut et variantes d'un média, pour son seul propriétaire. L'app interroge cette route jusqu'à `ready` ou `failed`.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Le média.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/me:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Ma session d'administration
      description: Vérifie que l'utilisateur authentifié a le rôle `admin` (connexion au backoffice, puis chaque page et chaque action). Un admin n'a pas besoin de profil.
      responses:
        '200':
          description: L'appelant est admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Rechercher des utilisateurs
      description: |
        Comptes du plus récent au plus ancien, par pages de 20 (comptes supprimés exclus). `q` filtre par correspondance partielle sur le username ou le nom, insensible à la casse (sans espaces superflus ni `@` initial) ; `status` filtre par statut.
      parameters:
        - name: q
          in: query
          required: false
          description: Username ou nom, partiel ; 1 à 30 caractères après suppression des espaces et du `@` initial.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de comptes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/users/{id}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Fiche d'un utilisateur
      description: Profil, statut, compteurs, abonnement Clone Plus, et les 20 signalements reçus (compte, ses posts, ses commentaires) et émis les plus récents, avec leur total. Compte inexistant ou supprimé → `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: La fiche.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Supprimer un compte
      description: |
        Même suppression que `DELETE /v1/me` : utilisateur Supabase Auth supprimé (accès coupé), profil supprimé, puis purge des données et fichiers. Motif obligatoire, écrit dans le journal d'audit.
        Compte inexistant ou déjà supprimé → `404 user_not_found` ; Supabase Auth injoignable → `500`, compte intact.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '204':
          description: Compte supprimé ; la purge suit.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          $ref: '#/components/responses/CannotModerateSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/users/{id}/suspend:
    post:
      operationId: suspendAdminUser
      tags: [admin]
      summary: Suspendre un compte
      description: |
        Compte `active` → `suspended` : toute route lui est refusée sauf `GET /v1/me` et `DELETE /v1/me` (`403 account_suspended`) ; son profil et ses contenus deviennent invisibles (ADR-006).
        Motif obligatoire, écrit dans le journal d'audit. Autre statut → `409 invalid_status_transition` ; compte inexistant ou supprimé → `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Compte avec son nouveau statut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: Le statut actuel ne permet pas cette action (`invalid_status_transition`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/CannotModerateSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/users/{id}/ban:
    post:
      operationId: banAdminUser
      tags: [admin]
      summary: Bannir un compte
      description: |
        Compte `active` ou `suspended` → `banned`. Mêmes effets qu'une suspension (ADR-005).
        Motif obligatoire, écrit dans le journal d'audit. Autre statut → `409 invalid_status_transition` ; compte inexistant ou supprimé → `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Compte avec son nouveau statut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: Le statut actuel ne permet pas cette action (`invalid_status_transition`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/CannotModerateSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/users/{id}/reactivate:
    post:
      operationId: reactivateAdminUser
      tags: [admin]
      summary: Réactiver un compte
      description: |
        Compte `suspended` ou `banned` → `active` : accès et visibilité rétablis.
        Motif obligatoire, écrit dans le journal d'audit. Autre statut → `409 invalid_status_transition` ; compte inexistant ou supprimé → `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Compte avec son nouveau statut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: Le statut actuel ne permet pas cette action (`invalid_status_transition`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/CannotModerateSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/reports:
    get:
      operationId: listAdminReports
      tags: [admin]
      summary: File des signalements
      description: |
        Signalements du plus récent au plus ancien, par pages de 20. `status` vaut `open` par défaut ; `reason` et `targetType` filtrent par motif et par type de contenu. Un admin voit tous les signalements, sans politique de visibilité.
      parameters:
        - name: status
          in: query
          required: false
          description: Statut des signalements ; `open` si absent.
          schema:
            $ref: '#/components/schemas/AdminReportStatus'
        - name: reason
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReportReason'
        - name: targetType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReportTargetType'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de signalements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/reports/{id}:
    get:
      operationId: getAdminReport
      tags: [admin]
      summary: Détail d'un signalement
      description: Signalement avec l'aperçu du contenu visé (post, commentaire ou compte), même privé ou déjà supprimé. Signalement inexistant → `404 report_not_found`.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Le signalement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/ReportNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/reports/{id}/resolve:
    post:
      operationId: resolveAdminReport
      tags: [admin]
      summary: Traiter un signalement
      description: |
        Une décision par contenu : tous les signalements ouverts sur le même contenu prennent le même statut, dans la même transaction, et l'action est écrite dans le journal d'audit.
        - `remove_content` : suppression du post (médias détachés, puis fichiers purgés par le worker) ou du commentaire (avec ses réponses), compteurs mis à jour ; statut `resolved_removed`. Un contenu déjà supprimé est accepté, sans autre effet. Refusé pour un compte (`422 cannot_remove_user`) : la sanction passe par `/v1/admin/users/{id}/…`.
        - `dismiss` : classement sans effet sur le contenu ; statut `resolved_dismissed`.
        Signalement inexistant → `404 report_not_found` ; déjà traité → `409 report_already_resolved`.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportRequest'
      responses:
        '200':
          description: Le signalement traité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/ReportNotFound'
        '409':
          description: Le signalement n'est plus ouvert (`report_already_resolved`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Suppression demandée pour un compte (`cannot_remove_user`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Supabase Auth.
  schemas:
    RealtimeAuth:
      type: object
      additionalProperties: false
      required: [type, token]
      properties:
        type:
          type: string
          enum: [auth]
        token:
          type: string
          minLength: 1
    RealtimeAuthOK:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [auth.ok]
    ActivityCreated:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [activity.created]
        data:
          type: object
          required: [unreadCount]
          properties:
            unreadCount:
              type: integer
              minimum: 0
    MediaReady:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [media.ready]
        data:
          type: object
          required: [mediaId, variants]
          properties:
            mediaId:
              type: string
              format: uuid
            variants:
              oneOf:
                - $ref: '#/components/schemas/ImageVariants'
                - $ref: '#/components/schemas/VideoVariants'
    MediaFailed:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [media.failed]
        data:
          type: object
          required: [mediaId, reason]
          properties:
            mediaId:
              type: string
              format: uuid
            reason:
              $ref: '#/components/schemas/MediaFailureReason'
    RealtimeEvent:
      oneOf:
        - $ref: '#/components/schemas/RealtimeAuthOK'
        - $ref: '#/components/schemas/ActivityCreated'
        - $ref: '#/components/schemas/MediaReady'
        - $ref: '#/components/schemas/MediaFailed'
      discriminator:
        propertyName: type
        mapping:
          auth.ok: '#/components/schemas/RealtimeAuthOK'
          activity.created: '#/components/schemas/ActivityCreated'
          media.ready: '#/components/schemas/MediaReady'
          media.failed: '#/components/schemas/MediaFailed'
    RealtimeClientMessage:
      oneOf:
        - $ref: '#/components/schemas/RealtimeAuth'
      discriminator:
        propertyName: type
        mapping:
          auth: '#/components/schemas/RealtimeAuth'
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Username:
      type: string
      description: 1 à 30 caractères `[a-z0-9._]`, en minuscules (ADR-007).
      minLength: 1
      maxLength: 30
      pattern: '^[a-z0-9._]{1,30}$'
      examples: ['killian.b']
    FullName:
      type: string
      description: Nom affiché, 1 à 30 caractères, au moins un caractère autre qu'un espace.
      minLength: 1
      maxLength: 30
      pattern: '\S'
      examples: ['Killian Boularand']
    Bio:
      type: string
      description: 150 caractères au plus ; chaîne vide si aucune bio.
      maxLength: 150
    AccountStatus:
      type: string
      enum: [active, suspended, banned]
    Me:
      type: object
      description: Profil de l'utilisateur authentifié.
      required:
        [
          id,
          username,
          fullName,
          bio,
          birthDate,
          isPrivate,
          status,
          followerCount,
          followingCount,
          postCount,
          plan,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant Supabase Auth.
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        bio:
          $ref: '#/components/schemas/Bio'
        birthDate:
          type: string
          format: date
          description: Renvoyée à son seul propriétaire.
        isPrivate:
          type: boolean
        status:
          $ref: '#/components/schemas/AccountStatus'
        followerCount:
          type: integer
          minimum: 0
        followingCount:
          type: integer
          minimum: 0
        postCount:
          type: integer
          minimum: 0
        avatar:
          $ref: '#/components/schemas/ImageVariants'
          description: Photo de profil ; absente si aucune photo.
        plan:
          $ref: '#/components/schemas/Plan'
        plusExpiresAt:
          type: string
          format: date-time
          description: Fin de la période payée de Clone Plus ; absente si le plan est `free`.
        createdAt:
          type: string
          format: date-time
    Plan:
      type: string
      description: Plan de l'utilisateur selon l'API (règle `isPlus`, ADR-012) ; seul ce plan débloque un avantage dans l'app.
      enum: [free, plus]
    SubscriptionStatus:
      type: object
      description: Mon plan Clone Plus.
      required: [plan]
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        expiresAt:
          type: string
          format: date-time
          description: Fin de la période payée ; absente si le plan est `free`.
    CompleteOnboardingRequest:
      type: object
      additionalProperties: false
      required: [username, fullName, birthDate]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        birthDate:
          type: string
          format: date
          examples: ['2000-01-31']
    UpdateMeRequest:
      type: object
      description: Au moins un champ.
      additionalProperties: false
      minProperties: 1
      properties:
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        bio:
          $ref: '#/components/schemas/Bio'
        avatarMediaId:
          type: string
          format: uuid
          description: Nouvelle photo de profil ; le retrait passe par `DELETE /v1/me/avatar`.
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      required: [isPrivate]
      properties:
        isPrivate:
          type: boolean
          description: Compte privé (`true`) ou public (`false`).
    UsernameAvailability:
      type: object
      required: [username, available, suggestions]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        available:
          type: boolean
        suggestions:
          type: array
          description: Vide si le username est disponible ; sinon jusqu'à 3 usernames libres.
          maxItems: 3
          items:
            $ref: '#/components/schemas/Username'
    UserProfile:
      type: object
      description: Profil public d'un utilisateur, vu par l'appelant (sans date de naissance ni statut).
      required:
        [
          id,
          username,
          fullName,
          bio,
          isPrivate,
          followerCount,
          followingCount,
          postCount,
          relationship,
          canViewContent,
        ]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        bio:
          $ref: '#/components/schemas/Bio'
        isPrivate:
          type: boolean
        followerCount:
          type: integer
          minimum: 0
        followingCount:
          type: integer
          minimum: 0
        postCount:
          type: integer
          minimum: 0
        avatar:
          $ref: '#/components/schemas/ImageVariants'
          description: Photo de profil ; absente si aucune photo.
        relationship:
          $ref: '#/components/schemas/Relationship'
        canViewContent:
          type: boolean
          description: L'appelant peut voir les contenus (posts) ; `false` pour un compte privé qu'il ne suit pas, même avec une demande d'abonnement en attente (ADR-006).
    Relationship:
      type: object
      description: Relation entre l'appelant et le profil ; toutes les valeurs sont `false` sur son propre profil.
      required: [following, followedBy, requested]
      properties:
        following:
          type: boolean
          description: L'appelant suit ce profil.
        requested:
          type: boolean
          description: L'appelant a demandé à suivre ce profil (compte privé) et la demande est en attente ; bouton « Demandé ». Jamais `true` en même temps que `following`.
        followedBy:
          type: boolean
          description: Ce profil suit l'appelant.
    UserSummary:
      type: object
      description: Compte dans une liste ou un résultat de recherche, vu par l'appelant.
      required: [id, username, fullName, isPrivate, relationship]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        isPrivate:
          type: boolean
        avatar:
          $ref: '#/components/schemas/ImageVariants'
          description: Photo de profil ; absente si aucune photo.
        relationship:
          $ref: '#/components/schemas/Relationship'
    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/UserSummary'
        nextCursor:
          type: string
          description: Curseur de la page suivante ; absent sur la dernière page.
    UserSearchResults:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/UserSummary'
    FollowStatus:
      type: object
      description: Relation après l'action, et compteur d'abonnés du compte suivi.
      required: [following, requested, followerCount]
      properties:
        following:
          type: boolean
          description: L'appelant suit ce compte.
        requested:
          type: boolean
          description: L'appelant a une demande d'abonnement en attente vers ce compte privé (aucun accès à ses contenus).
        followerCount:
          type: integer
          minimum: 0
    ImageVariants:
      type: object
      description: URL publiques des variantes WebP d'une image (ADR-008).
      required: [thumb, medium, large]
      properties:
        thumb:
          type: string
          format: uri
          description: 150 px de large.
        medium:
          type: string
          format: uri
          description: 640 px de large.
        large:
          type: string
          format: uri
          description: 1080 px de large.
    VideoVariants:
      type: object
      description: URL publiques de la playlist HLS maître et de la miniature WebP.
      required: [hls, thumbnail]
      properties:
        hls:
          type: string
          format: uri
        thumbnail:
          type: string
          format: uri
    MediaKind:
      type: string
      description: Image ou vidéo MP4 de reel.
      enum: [image, video]
    MediaPurpose:
      type: string
      description: Usage prévu du média ; il ne peut être rattaché qu'à cet usage (ADR-008).
      enum: [avatar, post, story]
    MediaStatus:
      type: string
      description: '`pending_upload` → `uploaded` → `processing` → `ready` | `failed` (ADR-008).'
      enum: [pending_upload, uploaded, processing, ready, failed]
    MediaFailureReason:
      type: string
      description: |
        - `invalid_image` : le fichier n'est pas une image JPEG ou PNG ;
        - `file_too_large` : plus de 20 Mo (image) ou 50 Mo (vidéo) ;
        - `processing_error` : échec du traitement après ses tentatives.
        - `invalid_video` : fichier illisible ou sans flux vidéo ;
        - `video_too_long` : durée supérieure à 60,5 secondes.
      enum: [invalid_image, file_too_large, processing_error, invalid_video, video_too_long]
    MediaUploadRequest:
      type: object
      additionalProperties: false
      required: [kind, purpose, mimeType, sizeBytes]
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        mimeType:
          type: string
          enum: [image/jpeg, image/png, video/mp4]
        sizeBytes:
          type: integer
          description: Taille déclarée du fichier ; le worker revérifie le fichier réel.
          minimum: 1
          maximum: 52428800
      if:
        properties:
          kind:
            const: image
      then:
        properties:
          mimeType:
            enum: [image/jpeg, image/png]
          sizeBytes:
            type: integer
            maximum: 20971520
      else:
        properties:
          purpose:
            const: post
          mimeType:
            const: video/mp4
    MediaUploadIntent:
      type: object
      required: [mediaId, uploadUrl, expiresAt]
      properties:
        mediaId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: URL présignée ; `PUT` du contenu brut du fichier.
        expiresAt:
          type: string
          format: date-time
    Media:
      type: object
      description: Un de mes médias.
      required: [id, kind, purpose, status]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MediaKind'
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        status:
          $ref: '#/components/schemas/MediaStatus'
        variants:
          oneOf:
            - $ref: '#/components/schemas/ImageVariants'
            - $ref: '#/components/schemas/VideoVariants'
          description: Présentes quand le média est `ready`.
        failureReason:
          $ref: '#/components/schemas/MediaFailureReason'
          description: Présent quand le média est `failed`.
    PostKind:
      type: string
      description: Post photo ou reel vidéo.
      enum: [post, reel]
    Caption:
      type: string
      description: Légende, 2 200 caractères au plus ; chaîne vide si aucune légende.
      maxLength: 2200
    CreatePostRequest:
      type: object
      additionalProperties: false
      required: [kind, mediaIds]
      properties:
        kind:
          $ref: '#/components/schemas/PostKind'
        caption:
          $ref: '#/components/schemas/Caption'
        mediaIds:
          type: array
          description: Médias du post, dans l'ordre d'affichage (1 à 10 images).
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
      if:
        properties:
          kind:
            const: reel
      then:
        properties:
          mediaIds:
            type: array
            maxItems: 1
    PostAuthor:
      type: object
      description: Auteur d'un post.
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
        avatar:
          $ref: '#/components/schemas/ImageVariants'
          description: Photo de profil ; absente si aucune photo.
    PostMedia:
      type: object
      description: Un média de post ; `width` et `height` (en pixels) donnent son ratio d'affichage.
      required: [variants, width, height]
      properties:
        variants:
          oneOf:
            - $ref: '#/components/schemas/ImageVariants'
            - $ref: '#/components/schemas/VideoVariants'
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        durationMs:
          type: integer
          minimum: 1
          description: Durée du reel en millisecondes ; absente pour une image.
    Post:
      type: object
      required:
        [id, kind, caption, author, media, likeCount, viewerHasLiked, commentCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PostKind'
        caption:
          $ref: '#/components/schemas/Caption'
        author:
          $ref: '#/components/schemas/PostAuthor'
        media:
          type: array
          description: Médias dans l'ordre d'affichage.
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/PostMedia'
        likeCount:
          type: integer
          minimum: 0
        viewerHasLiked:
          type: boolean
          description: L'appelant aime ce post.
        commentCount:
          type: integer
          minimum: 0
          description: Nombre de commentaires non supprimés, réponses comprises.
        createdAt:
          type: string
          format: date-time
    PostPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/Post'
        nextCursor:
          type: string
          description: Curseur de la page suivante ; absent sur la dernière page.
    StoryAudience:
      type: string
      description: '`everyone` : qui peut voir mes contenus ; `close_friends` : mes amis proches seulement (ADR-025).'
      enum: [everyone, close_friends]
    CreateStoryRequest:
      type: object
      additionalProperties: false
      required: [mediaId, audience]
      properties:
        mediaId:
          type: string
          format: uuid
          description: Image `ready`, de `purpose` `story`.
        audience:
          $ref: '#/components/schemas/StoryAudience'
    ViewStoryRequest:
      type: object
      additionalProperties: false
      properties:
        anonymous:
          type: boolean
          description: Vue anonyme réservée à Clone Plus ; aucune vue enregistrée ni comptée. Par défaut false.
          enum: [false, true]
    StoryMedia:
      type: object
      description: Photo de la story ; `width` et `height` (en pixels) donnent son ratio.
      required: [variants, width, height]
      properties:
        variants:
          $ref: '#/components/schemas/ImageVariants'
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    Story:
      type: object
      required: [id, author, audience, media, viewerHasSeen, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/PostAuthor'
        audience:
          $ref: '#/components/schemas/StoryAudience'
        media:
          $ref: '#/components/schemas/StoryMedia'
        viewerHasSeen:
          type: boolean
          description: L'appelant a déjà vu cette story (toujours `true` pour l'auteur).
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Fin de la période active (24 h, ou 48 h pour une story publiée en Clone Plus).
    StoryViewerAccount:
      type: object
      required: [id, username, fullName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        avatar:
          $ref: '#/components/schemas/ImageVariants'
    StoryViewer:
      type: object
      required: [viewer, viewedAt]
      properties:
        viewer:
          $ref: '#/components/schemas/StoryViewerAccount'
        viewedAt:
          type: string
          format: date-time
    StoryViewerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoryViewer'
        nextCursor:
          type: string
          description: Curseur opaque ; absent sur la dernière page.
    ArchivedStoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Story'
        nextCursor:
          type: string
          description: Curseur opaque ; absent sur la dernière page.
    StoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: De la plus ancienne à la plus récente.
          items:
            $ref: '#/components/schemas/Story'
    StoryTrayItem:
      type: object
      description: Un auteur du bandeau.
      required: [author, seen, hasCloseFriendsStory, latestStoryAt]
      properties:
        author:
          $ref: '#/components/schemas/PostAuthor'
        seen:
          type: boolean
          description: J'ai vu toutes ses stories actives visibles.
        hasCloseFriendsStory:
          type: boolean
          description: Au moins une de ses stories actives visibles est réservée à ses amis proches (anneau distinct).
        latestStoryAt:
          type: string
          format: date-time
          description: Date de sa story active visible la plus récente.
    StoryTray:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StoryTrayItem'
    LikeStatus:
      type: object
      description: État du like après l'action, et nombre de likes du post.
      required: [liked, likeCount]
      properties:
        liked:
          type: boolean
          description: L'appelant aime ce post.
        likeCount:
          type: integer
          minimum: 0
    CommentBody:
      type: string
      description: Texte du commentaire, 2 200 caractères au plus, avec au moins un caractère visible ; espaces de début et de fin retirés.
      minLength: 1
      maxLength: 2200
      pattern: '\S'
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          $ref: '#/components/schemas/CommentBody'
        parentId:
          type: string
          format: uuid
          description: Commentaire de premier niveau de ce post auquel on répond ; absent pour un commentaire de premier niveau.
    Comment:
      type: object
      description: Commentaire ou réponse, vu par l'appelant.
      required: [id, postId, author, body, replyCount, createdAt, viewerCanDelete]
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          description: Commentaire auquel celui-ci répond ; absent pour un commentaire de premier niveau.
        author:
          $ref: '#/components/schemas/PostAuthor'
        body:
          $ref: '#/components/schemas/CommentBody'
        replyCount:
          type: integer
          minimum: 0
          description: Nombre de réponses non supprimées ; toujours 0 pour une réponse.
        createdAt:
          type: string
          format: date-time
        viewerCanDelete:
          type: boolean
          description: L'appelant peut supprimer ce commentaire (il en est l'auteur, ou l'auteur du post).
    CommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Comment'
        nextCursor:
          type: string
          description: Curseur de la page suivante ; absent sur la dernière page.
    ActivityType:
      type: string
      description: |
        Type de notification (ADR-026) : `like` (J'aime d'un de mes posts), `comment` (commentaire d'un de mes posts), `comment_reply` (réponse à un de mes commentaires), `follow` (nouvel abonné), `follow_request` (demande d'abonnement reçue, retirée quand elle est annulée, acceptée ou refusée), `follow_accepted` (un compte privé a accepté ma demande).
        Liste ouverte : d'autres types arrivent avec les tranches suivantes ; le client ignore un groupe d'un type qu'il ne connaît pas (ADR-019).
      examples: [like]
    ActivityActor:
      type: object
      description: Compte à l'origine de la notification la plus récente du groupe.
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
        avatar:
          $ref: '#/components/schemas/ImageVariants'
          description: Photo de profil ; absente si aucune photo.
    ActivityPost:
      type: object
      description: Post visé, avec la miniature de sa première image.
      required: [id, thumbnail]
      properties:
        id:
          type: string
          format: uuid
        thumbnail:
          $ref: '#/components/schemas/ImageVariants'
    ActivityComment:
      type: object
      description: Commentaire ou réponse qui a créé la notification.
      required: [id, body]
      properties:
        id:
          type: string
          format: uuid
        body:
          $ref: '#/components/schemas/CommentBody'
    ActivityGroup:
      type: object
      description: Groupe de notifications de même type sur la même cible, vu par son destinataire.
      required: [id, type, actor, actorCount, createdAt, read]
      properties:
        id:
          type: string
          description: Identifiant opaque et stable du groupe.
        type:
          $ref: '#/components/schemas/ActivityType'
        actor:
          $ref: '#/components/schemas/ActivityActor'
        actorCount:
          type: integer
          minimum: 1
          description: Nombre de comptes du groupe, acteur le plus récent compris (« léa et 1 autre » → 2).
        createdAt:
          type: string
          format: date-time
          description: Date de la notification la plus récente du groupe.
        read:
          type: boolean
          description: '`false` si le groupe contient au moins une notification non lue.'
        post:
          $ref: '#/components/schemas/ActivityPost'
          description: Post visé (`like`, `comment`, `comment_reply`) ; absent pour `follow`, `follow_request` et `follow_accepted`.
        comment:
          $ref: '#/components/schemas/ActivityComment'
          description: Commentaire ou réponse (`comment`, `comment_reply`) ; absent sinon.
    ActivityPage:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ActivityGroup'
        nextCursor:
          type: string
          description: Curseur de la page suivante ; absent sur la dernière page.
        unreadCount:
          type: integer
          minimum: 0
          description: Nombre de groupes contenant au moins une notification non lue.
    ProblemDetails:
      type: object
      description: Erreur au format Problem Details (RFC 9457).
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifiant du type de problème (`about:blank` par défaut).
          examples: ['about:blank']
        title:
          type: string
          description: Résumé lisible du statut HTTP.
          examples: ['Not Found']
        status:
          type: integer
          minimum: 100
          maximum: 599
          examples: [404]
        detail:
          type: string
          description: Explication lisible de cette occurrence.
        code:
          type: string
          description: Code stable, destiné au client (ex. `validation_failed`, `username_taken`).
          examples: ['route_not_found']
    ReportTargetType:
      type: string
      description: Type de contenu signalé (stories et messages en P1).
      enum: [post, comment, user]
    ReportReason:
      type: string
      description: Motif du signalement.
      enum: [spam, nudity, harassment, violence, hate, other]
    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, reason]
      properties:
        targetType:
          $ref: '#/components/schemas/ReportTargetType'
        targetId:
          type: string
          format: uuid
          description: Identifiant du post, du commentaire ou du compte signalé.
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type: string
          maxLength: 500
          description: Précisions facultatives, 500 caractères au plus.
    ReportCreated:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    AdminSession:
      type: object
      description: Utilisateur authentifié qui a le rôle `admin`.
      required: [id, role]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant Supabase Auth.
        role:
          type: string
          enum: [admin]
    AdminActionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: Motif de l'action, 500 caractères au plus, avec au moins un caractère visible ; espaces de début et de fin retirés.
          minLength: 1
          maxLength: 500
          pattern: '\S'
    AdminUserSummary:
      type: object
      description: Compte vu par un admin.
      required:
        [id, username, fullName, status, followerCount, followingCount, postCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: '#/components/schemas/Username'
        fullName:
          $ref: '#/components/schemas/FullName'
        status:
          $ref: '#/components/schemas/AccountStatus'
        avatar:
          $ref: '#/components/schemas/ImageVariants'
          description: Photo de profil ; absente si aucune photo.
        followerCount:
          type: integer
          minimum: 0
        followingCount:
          type: integer
          minimum: 0
        postCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    AdminUserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        nextCursor:
          type: string
          description: Curseur de la page suivante ; absent sur la dernière page.
    AdminReportStatus:
      type: string
      enum: [open, resolved_removed, resolved_dismissed]
    AdminReport:
      type: object
      description: Signalement vu par un admin.
      required: [id, targetType, targetId, reason, status, reporter, createdAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/ReportTargetType'
        targetId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type: string
        status:
          $ref: '#/components/schemas/AdminReportStatus'
        reporter:
          $ref: '#/components/schemas/PostAuthor'
        createdAt:
          type: string
          format: date-time
    AdminReportList:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          description: Les 20 plus récents.
          maxItems: 20
          items:
            $ref: '#/components/schemas/AdminReport'
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          description: Fiche d'un compte vue par un admin.
          required: [bio, isPrivate, plan, reportsReceived, reportsFiled]
          properties:
            bio:
              $ref: '#/components/schemas/Bio'
            isPrivate:
              type: boolean
            plan:
              $ref: '#/components/schemas/Plan'
            plusExpiresAt:
              type: string
              format: date-time
              description: Fin de la période payée de Clone Plus ; absente si le plan est `free`.
            reportsReceived:
              $ref: '#/components/schemas/AdminReportList'
              description: Signalements visant le compte, ses posts ou ses commentaires.
            reportsFiled:
              $ref: '#/components/schemas/AdminReportList'
              description: Signalements émis par le compte.
    AdminReportSummary:
      allOf:
        - $ref: '#/components/schemas/AdminReport'
        - type: object
          description: Signalement de la file du backoffice.
          properties:
            excerpt:
              type: string
              description: Début de la légende du post, du texte du commentaire, ou username du compte visé ; absent si le contenu n'existe plus.
    AdminReportPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AdminReportSummary'
        nextCursor:
          type: string
          description: Curseur de la page suivante ; absent sur la dernière page.
    AdminReportedPost:
      type: object
      description: Post signalé, vu par un admin.
      required: [id, author, caption, media, createdAt, removed]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/PostAuthor'
        caption:
          $ref: '#/components/schemas/Caption'
        media:
          type: array
          description: Images dans l'ordre d'affichage ; vide une fois les fichiers purgés.
          maxItems: 10
          items:
            $ref: '#/components/schemas/PostMedia'
        createdAt:
          type: string
          format: date-time
        removed:
          type: boolean
          description: Post supprimé (par son auteur ou par modération).
    AdminReportedComment:
      type: object
      description: Commentaire signalé, vu par un admin.
      required: [id, postId, author, body, createdAt, removed]
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/PostAuthor'
        body:
          $ref: '#/components/schemas/CommentBody'
        createdAt:
          type: string
          format: date-time
        removed:
          type: boolean
          description: Commentaire supprimé (par son auteur, l'auteur du post ou par modération).
    AdminReportDetail:
      allOf:
        - $ref: '#/components/schemas/AdminReport'
        - type: object
          description: |
            Détail d'un signalement vu par un admin. Selon `targetType`, un seul des champs `post`, `comment` ou `user` est présent ; aucun si le contenu a été purgé (compte supprimé).
          required: [otherOpenCount]
          properties:
            resolvedAt:
              type: string
              format: date-time
              description: Date du traitement ; absente si le signalement est ouvert.
            resolutionNote:
              type: string
              description: Note de l'admin au traitement.
            otherOpenCount:
              type: integer
              minimum: 0
              description: Autres signalements ouverts sur le même contenu, traités en même temps que celui-ci.
            post:
              $ref: '#/components/schemas/AdminReportedPost'
            comment:
              $ref: '#/components/schemas/AdminReportedComment'
            user:
              $ref: '#/components/schemas/AdminUserSummary'
    ResolutionAction:
      type: string
      description: '`remove_content` supprime le contenu signalé ; `dismiss` classe le signalement.'
      enum: [remove_content, dismiss]
    ResolveReportRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/ResolutionAction'
        note:
          type: string
          description: Note facultative de l'admin, 500 caractères au plus ; espaces de début et de fin retirés, vide = absente.
          maxLength: 500
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Valeur de `nextCursor` de la page précédente ; opaque.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequesterId:
      name: requesterId
      in: path
      required: true
      description: Identifiant du compte qui a demandé à me suivre.
      schema:
        type: string
        format: uuid
    CloseFriendId:
      name: userId
      in: path
      required: true
      description: Identifiant du compte à ajouter à mes amis proches ou à en retirer.
      schema:
        type: string
        format: uuid
    MediaId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationFailed:
      description: Entrée non conforme au schéma (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthenticated:
      description: JWT absent ou invalide (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProfileNotFound:
      description: Onboarding non terminé (`profile_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    MediaNotFound:
      description: Média inexistant ou d'un autre utilisateur (`media_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InvalidInput:
      description: Entrée non conforme au schéma (`validation_failed`) ou curseur invalide (`invalid_cursor`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CannotFollowSelf:
      description: On ne peut pas se suivre soi-même (`cannot_follow_self`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CannotBlockSelf:
      description: On ne peut pas se bloquer soi-même (`cannot_block_self`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CannotCloseFriendSelf:
      description: On ne peut ni s'ajouter soi-même à ses amis proches ni s'en retirer (`cannot_close_friend_self`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UserNotFound:
      description: Profil inexistant ou invisible pour l'appelant (`user_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    FollowRequestNotFound:
      description: Demande d'abonnement inexistante ou demandeur invisible (`follow_request_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PostNotFound:
      description: Post inexistant, supprimé ou invisible pour l'appelant (`post_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PlusRequired:
      description: Avantage réservé à Clone Plus (`403 plus_required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    StoryNotFound:
      description: Story inexistante, supprimée, expirée ou invisible pour l'appelant (`story_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    LikeTargetNotFound:
      description: Post inexistant, supprimé ou invisible pour l'appelant (`post_not_found`), ou onboarding non terminé (`profile_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CommentNotFound:
      description: Commentaire inexistant, supprimé ou invisible pour l'appelant (`comment_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AdminForbidden:
      description: Rôle `admin` requis (`admin_required`) ou compte suspendu (`account_suspended`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ReportNotFound:
      description: Signalement inexistant (`report_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CannotModerateSelf:
      description: Un admin ne peut pas se viser lui-même (`cannot_moderate_self`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimited:
      description: Trop de requêtes (`rate_limited`) ; réessayer après `Retry-After` secondes.
      headers:
        Retry-After:
          description: Délai avant de réessayer, en secondes.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: Erreur inattendue (`internal_error`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
