      summary: Fil de reels
      description: |
        Reels non supprimés et visibles des comptes publics et suivis (privés compris), mes propres reels exclus, du plus récent au plus ancien, par pages de 10. Comptes bloqués dans les deux sens et non actifs exclus (ADR-006, ADR-029).
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page du feed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
