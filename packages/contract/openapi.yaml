        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/users/{id}/follow:
    put:
      operationId: followUser
      tags: [social]
      summary: Suivre un utilisateur
      description: |
        Compte public : abonnement direct (`following: true`). Compte privé non suivi : crée une demande d'abonnement (`requested: true`), sans aucun accès à ses contenus tant qu'elle n'est pas acceptée ; le compte privé est notifié (`follow_request`).
        Idempotent : suivre un compte déjà suivi, ou redemander un compte déjà demandé, renvoie `200` sans rien changer.
        Compte inexistant, bloqué dans un sens ou dans l'autre, ou non actif : `404 user_not_found` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: J'ai suivi ce compte, ou demandé à le suivre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowStatus'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Compte introuvable ou invisible (`user_not_found`), ou onboarding non terminé (`profile_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/CannotFollowSelf'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: unfollowUser
      tags: [social]
      summary: Ne plus suivre un utilisateur
      description: |
        Supprime mon abonnement, ou annule ma demande d'abonnement en attente (sa notification est retirée). Idempotent : sans abonnement ni demande, renvoie `200` sans changer les compteurs. Possible vers un compte privé. Compte inexistant ou invisible : `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Je ne suis plus ce compte, et je n'ai plus de demande en attente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowStatus'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          $ref: '#/components/responses/CannotFollowSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/users/{id}/block:
    put:
      operationId: blockUser
      tags: [social]
      summary: Bloquer un utilisateur
      description: |
        Supprime les abonnements dans les deux sens (compteurs mis à jour) ; les deux comptes deviennent ensuite mutuellement invisibles (ADR-006). Idempotent : bloquer un compte déjà bloqué renvoie `204` sans effet.
        Compte inexistant, qui m'a bloqué, ou non actif : `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Compte bloqué.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Compte introuvable ou invisible (`user_not_found`), ou onboarding non terminé (`profile_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/CannotBlockSelf'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: unblockUser
      tags: [social]
      summary: Débloquer un utilisateur
      description: |
        Idempotent : débloquer un compte non bloqué renvoie `204` sans effet. Les abonnements supprimés au blocage ne sont pas rétablis. Compte inexistant : `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Compte débloqué.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          $ref: '#/components/responses/CannotBlockSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/users/{id}/follower:
    delete:
      operationId: removeFollower
      tags: [social]
      summary: Retirer un de mes abonnés
      description: |
        Ce compte ne me suit plus (compteurs mis à jour, notification `follow` retirée) ; il n'est pas prévenu. Idempotent : un compte qui ne me suit pas renvoie `204` sans effet.
        Compte inexistant, bloqué dans un sens ou dans l'autre, ou non actif : `404 user_not_found` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
