            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Post inexistant, supprimé ou invisible (`post_not_found`), commentaire parent inexistant, supprimé, invisible ou d'un autre post (`comment_not_found`), ou onboarding non terminé (`profile_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Réponse à une réponse (`reply_to_reply`) ou plus de 20 mentions distinctes (`too_many_mentions`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/comments/{id}/replies:
    get:
      operationId: listReplies
      tags: [engagement]
      summary: Réponses à un commentaire
      description: |
        Réponses non supprimées, du plus récent au plus ancien, par pages de 20. Réponses des auteurs bloqués dans un sens ou dans l'autre et des comptes non actifs absentes (ADR-006).
        Commentaire inexistant, supprimé, ou dont le post ou l'auteur est invisible pour l'appelant → `404 comment_not_found`.
      parameters:
        - $ref: '#/components/parameters/CommentId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de réponses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CommentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/comments/{id}:
    delete:
      operationId: deleteComment
      tags: [engagement]
      summary: Supprimer un commentaire
      description: |
        Suppression logique (ADR-007) par l'auteur du commentaire ou par l'auteur du post. Supprimer un commentaire supprime ses réponses : `commentCount` du post baisse de 1 + nombre de réponses supprimées ; supprimer une réponse baisse aussi `replyCount` de son parent.
        Commentaire inexistant, déjà supprimé, invisible, ou supprimé par quelqu'un d'autre → `404 comment_not_found`, jamais `403` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '204':
          description: Commentaire supprimé.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CommentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/stories:
    post:
      operationId: createStory
      tags: [stories]
      summary: Publier une story
      description: |
        Crée une story à partir d'une image `ready`, à moi, de `purpose` `story`, jamais utilisée (ADR-008). Elle est active 24 h, ou 48 h si je suis abonné Clone Plus au moment de la publication (ADR-012) ; cette durée ne change plus ensuite.
        Audience `everyone` (qui peut voir mes contenus) ou `close_friends` (mes amis proches seulement). Une vidéo renvoie `422 media_kind_mismatch`. Limité à 20 stories par heure (`429 rate_limited`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoryRequest'
      responses:
        '201':
          description: Story publiée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Onboarding non terminé (`profile_not_found`) ou média introuvable (`media_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Média pas encore prêt (`media_not_ready`) ou déjà utilisé (`media_already_attached`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Média vidéo (`media_kind_mismatch`) ou prévu pour un autre usage (`media_purpose_mismatch`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/stories/tray:
    get:
      operationId: getStoryTray
      tags: [stories]
      summary: Bandeau des stories
      description: |
        Auteurs (moi-même et les comptes que je suis) ayant au moins une story active que je peux voir (`canViewStory`, ADR-006), au plus 100.
        Ordre : ma story d'abord, puis les auteurs ayant une story non vue, puis les autres ; dans chaque groupe, de la story la plus récente à la plus ancienne. Un auteur est vu quand j'ai vu toutes ses stories actives visibles.
      responses:
        '200':
          description: Le bandeau.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryTray'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/stories/{id}:
    patch:
      operationId: updateStoryDescription
      tags: [stories]
      summary: Modifier la description alternative d’une de mes stories
      description: Auteur uniquement, story active ou archivée. Une chaîne vide retire la description. Story absente, supprimée ou d’un autre auteur → 404 story_not_found.
      parameters:
        - $ref: '#/components/parameters/StoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoryDescriptionRequest'
      responses:
        '200':
          description: Story mise à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/StoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteStory
      tags: [stories]
      summary: Supprimer une de mes stories
      description: |
        Suppression logique par l'auteur (ADR-007), active ou expirée : la story disparaît de toutes les lectures et son média est détaché, puis purgé par `purge-orphan-media` (ADR-008).
        Story inexistante, déjà supprimée ou d'un autre auteur → `404 story_not_found`, jamais `403` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/StoryId'
      responses:
        '204':
          description: Story supprimée.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/StoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/stories/{id}/viewers:
    get:
      operationId: listStoryViewers
      tags: [stories]
      summary: Liste des vues de ma story active ou archivée
      description: Auteur seulement (404 pour les autres). Comptes bloqués et non actifs exclus. Curseur (viewed_at, viewer_id), vues les plus récentes en premier. Recherche par username ou nom réservée à Clone Plus (403 plus_required).
