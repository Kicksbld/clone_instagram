openapi: 3.1.1
info:
  title: Clone Instagram API
  version: 0.1.0
  description: |
    Contrat unique des échanges entre l'API, l'app iOS et le backoffice (ADR-003).

    - Routes métier préfixées par `/v1` ; `GET /health` est hors version.
    - JSON UTF-8, identifiants UUID v7, dates ISO 8601 UTC.
    - Authentification : `Authorization: Bearer <JWT Supabase>` sur toutes les routes sauf `GET /health`.
    - Erreurs : Problem Details (RFC 9457), `Content-Type: application/problem+json`, avec un `code` stable.

    Codes d'erreur transverses :

    | Code | Statut | Cas |
    |---|---|---|
    | `validation_failed` | 400 | Entrée non conforme au schéma (dont champ inconnu) |
    | `unauthenticated` | 401 | JWT absent, mal formé, mal signé, expiré ou d'un autre émetteur |
    | `account_suspended` | 403 | Compte suspendu ou banni (ADR-005) : toute route `/v1` est refusée, sauf `GET /v1/me` (statut du compte) et `DELETE /v1/me` |
    | `route_not_found` | 404 | Route inexistante |
    | `rate_limited` | 429 | Trop de requêtes (ADR-005) : 120 par minute et par utilisateur sur toute route `/v1`, limite plus basse sur certaines routes (documentée sur la route) ; en-tête `Retry-After` en secondes |
    | `internal_error` | 500 | Erreur inattendue ; aucun détail interne exposé |

    Codes d'erreur métier :

    | Code | Statut | Cas |
    |---|---|---|
    | `conversation_not_found` | 404 | Conversation inexistante, invisible ou appartenant à un tiers |
    | `cannot_message_self` | 422 | Conversation avec soi-même |
    | `profile_not_found` | 404 | L'utilisateur authentifié n'a pas encore de profil (onboarding non terminé) |
    | `username_taken` | 409 | Username déjà utilisé par un autre profil |
    | `profile_already_exists` | 409 | L'onboarding a déjà créé le profil |
    | `age_requirement_not_met` | 422 | Moins de 13 ans à la date du jour (UTC) |
    | `media_not_found` | 404 | Média inexistant ou appartenant à un autre utilisateur ; URL signée d'une photo de message hors de mes conversations visibles |
    | `media_invalid_transition` | 409 | Le statut du média ne permet pas l'opération (ex. `complete` sur un média déjà traité) |
    | `media_not_ready` | 409 | Le média n'est pas encore `ready` |
    | `media_already_attached` | 409 | Le média est déjà utilisé, ou l'a été (un média ne sert qu'une fois) |
    | `media_kind_mismatch` | 422 | Le type du média ne correspond pas au type du post ou du message |
    | `media_purpose_mismatch` | 422 | Le `purpose` du média ne correspond pas à l'usage demandé |
    | `user_not_found` | 404 | Profil inexistant ou invisible pour l'appelant (blocage dans un sens ou dans l'autre, compte non actif : ADR-006) ; liste d'abonnés d'un compte privé non suivi |
    | `account_private` | 403 | Plus renvoyé depuis T20 : suivre un compte privé crée une demande d'abonnement |
    | `cannot_follow_self` | 422 | Se suivre, ne plus se suivre ou se retirer de ses abonnés soi-même |
    | `follow_request_not_found` | 404 | Demande d'abonnement inexistante (annulée, déjà acceptée ou refusée) ou dont le demandeur est invisible (ADR-006) |
    | `invalid_cursor` | 400 | Curseur de pagination mal formé |
    | `invalid_media_descriptions` | 400 | Nombre de descriptions différent du nombre de médias, ou description dépassant 1 000 caractères |
    | `post_not_found` | 404 | Post inexistant, supprimé ou invisible pour l'appelant (ADR-006) ; suppression du post d'un autre auteur |
    | `comment_not_found` | 404 | Commentaire inexistant, supprimé ou invisible pour l'appelant (ADR-006) ; commentaire parent d'un autre post ; suppression par quelqu'un qui n'est ni l'auteur du commentaire ni celui du post |
    | `too_many_mentions` | 422 | Plus de 20 comptes distincts mentionnés dans un texte |
    | `reply_to_reply` | 422 | Réponse à une réponse (un seul niveau de réponse) |
    | `cannot_block_self` | 422 | Se bloquer ou se débloquer soi-même |
    | `cannot_close_friend_self` | 422 | S'ajouter ou se retirer soi-même de ses amis proches |
    | `cannot_report_self` | 422 | Se signaler soi-même ou signaler son propre post ou commentaire |
    | `admin_required` | 403 | Route d'administration (`/v1/admin/…`) appelée par un compte sans rôle `admin` (ADR-011) |
    | `invalid_status_transition` | 409 | Le statut actuel du compte ne permet pas l'action d'administration (ex. suspendre un compte banni) |
    | `cannot_moderate_self` | 422 | Un admin ne peut ni se suspendre, ni se bannir, ni se réactiver, ni se supprimer lui-même |
    | `report_not_found` | 404 | Signalement inexistant (backoffice) |
    | `report_already_resolved` | 409 | Le signalement n'est plus ouvert : déjà supprimé ou classé, seul ou avec les autres signalements du même contenu |
    | `cannot_remove_user` | 422 | `remove_content` sur le signalement d'un compte : seul le classement est possible, la sanction passe par la fiche du compte |
    | `plus_required` | 403 | Avantage réservé à Clone Plus demandé sans abonnement actif (ADR-012) |
    | `story_not_found` | 404 | Story inexistante, supprimée, expirée ou invisible pour l'appelant (ADR-006, ADR-025) ; suppression de la story d'un autre auteur |

    Pagination : `?cursor=` (valeur opaque de `nextCursor`) ; réponse `{ items, nextCursor }`, `nextCursor` absent sur la dernière page (ADR-007).
servers:
  - url: /
    description: Même origine ; l'hôte dépend de l'environnement (local ou démo, ADR-009).
security:
  - bearerAuth: []
tags:
  - name: messaging
    description: Conversations privées et messages texte (ADR-023)
  - name: system
    description: Supervision de l'API
  - name: identity
    description: Profil de l'utilisateur authentifié, onboarding, usernames
  - name: media
    description: Upload présigné et traitement des médias (ADR-008)
  - name: users
    description: Profils des autres utilisateurs, selon la politique de visibilité (ADR-006)
  - name: social
    description: Abonnements, demandes d'abonnement, listes d'abonnés, blocages, amis proches et recherche d'utilisateurs (ADR-006)
  - name: posts
    description: Publication et lecture des posts, selon la politique de visibilité (ADR-006)
  - name: stories
    description: Stories photo éphémères (ADR-025), selon la politique de visibilité (ADR-006)
  - name: feed
    description: Feed d'accueil chronologique (ADR-007), selon la politique de visibilité (ADR-006)
  - name: engagement
    description: Likes et commentaires des posts, selon la politique de visibilité (ADR-006)
  - name: billing
    description: Abonnement Clone Plus, vérifié par l'API auprès de RevenueCat (ADR-012)
  - name: moderation
    description: Signalements de contenus et de comptes
  - name: activity
    description: Activité de l'utilisateur authentifié (notifications in-app, ADR-026)
  - name: admin
    description: Administration depuis le backoffice (ADR-011) ; rôle `admin` requis, chaque action écrite dans le journal d'audit
paths:
  /v1/conversations:
    get:
      operationId: listConversations
      tags: [messaging]
      summary: Mes conversations non vides, de la plus récente à la plus ancienne
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page de 20 conversations visibles, curseur (last_message_at, id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: getOrCreateConversation
      tags: [messaging]
      summary: Obtenir ou créer une conversation avec un compte, même privé non suivi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Conversation existante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '201':
          description: Conversation créée (vide, absente des listes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ConversationNotFound'
        '422':
          description: Conversation avec soi-même (cannot_message_self).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listMessages
      tags: [messaging]
      summary: Historique ou rattrapage des messages
      description: Curseur vers le passé (30, décroissant), ou after (100, croissant). Pour changer de mode, retirer le curseur précédent. after doit appartenir à cette conversation, sinon invalid_cursor. nextCursor sert à poursuivre chaque mode ; en rattrapage passer ce curseur avec after.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: after
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page des messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ConversationNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: sendMessage
      tags: [messaging]
      summary: Envoyer un texte, une photo ou un post, au plus 60 messages par minute
      description: |
        Même clientId du même expéditeur renvoie le message existant sans nouvel événement. Message et last_message_at dans une transaction ; message.created aux deux membres après validation.
        Partage (`kind = post_share`) : post ou reel visible de l’expéditeur ; aperçu relu selon chaque lecteur, y compris en temps réel. Supprimé ou invisible : sharedPost null, kind conservé. Un message et un clientId distinct par destinataire.
        Photo (`kind = image`) : média `image` de l'expéditeur, `purpose = message`, `ready` et jamais utilisé, rattaché au message dans la même transaction ; `body` facultatif.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SendTextMessage'
                - $ref: '#/components/schemas/SendImageMessage'
                - $ref: '#/components/schemas/SendPostShareMessage'
                - $ref: '#/components/schemas/SendStoryReplyMessage'
      responses:
        '201':
          description: Message créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '200':
          description: Message existant pour ce clientId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Conversation absente ou invisible (`conversation_not_found`), ou média inexistant ou d'un autre utilisateur (`media_not_found`), ou post invisible (`post_not_found`), ou story expirée, invisible, personnelle ou dont l’auteur n’est pas le destinataire (`story_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Média pas encore prêt (`media_not_ready`) ou déjà utilisé (`media_already_attached`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Média vidéo (`media_kind_mismatch`) ou prévu pour un autre usage (`media_purpose_mismatch`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/conversations/{id}/read:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: markConversationRead
      tags: [messaging]
      summary: Marquer la conversation comme lue jusqu'à ce message
      description: La position de lecture n'avance jamais ; un message plus ancien que la position actuelle est ignoré (204 sans effet). Message d'une autre conversation ou inexistant → 404. Après validation, conversation.read à l'autre membre si la position a avancé.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkConversationReadRequest'
      responses:
        '204':
          description: Position de lecture enregistrée (ou déjà plus récente).
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ConversationNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/ws:
    get:
      operationId: connectRealtime
      tags: [activity]
      summary: Connexion temps réel WebSocket (ADR-021)
      security: []
      description: |
        Upgrade WebSocket. Premier message RealtimeAuth obligatoire sous 5 secondes.
        Seuls les messages auth sont acceptés ; renouveler avant expiration du JWT.
        Réponse auth.ok puis événements RealtimeEvent, types inconnus ignorés.
        Fermeture 4401 pour auth absente, invalide, expirée ou compte supprimé ;
        4403 pour compte suspendu ou banni. Ping toutes les 30 secondes, sans pong fermeture.
        Aucun jeton dans l'URL. REST reste la source de vérité.
      responses:
        '101':
          description: Connexion WebSocket établie ; authentification par message.
        '400':
          description: Upgrade WebSocket invalide.
        '404':
          description: Upgrade WebSocket absent.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: État de l'API (liveness)
      description: Répond sans interroger Postgres ni Redis. Sans authentification.
      security: []
      responses:
        '200':
          description: L'API répond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Mon profil
      description: Profil de l'utilisateur authentifié, dont sa date de naissance et le statut du compte. `404 profile_not_found` tant que l'onboarding n'est pas terminé. Répond aussi pour un compte suspendu ou banni (l'app affiche alors l'écran « Compte suspendu », ADR-005).
      responses:
        '200':
          description: Mon profil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateMe
      tags: [identity]
      summary: Modifier mon profil
      description: Modifie le nom, la bio, le username ou la photo de profil. Seuls les champs présents sont modifiés ; une bio vide efface la bio. `avatarMediaId` désigne un média `ready`, à moi, de `purpose` `avatar`, jamais utilisé ; l'ancienne photo est détachée puis purgée (ADR-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Profil modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Onboarding non terminé (`profile_not_found`) ou média introuvable (`media_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Username déjà utilisé (`username_taken`), média pas encore prêt (`media_not_ready`) ou déjà utilisé (`media_already_attached`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Média prévu pour un autre usage (`media_purpose_mismatch`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMe
      tags: [identity]
      summary: Supprimer mon compte
      description: |
        Suppression réelle du compte (ADR-007) : l'accès est coupé immédiatement (utilisateur Supabase Auth supprimé, toute requête portant un JWT encore valide de ce compte → `401 unauthenticated`), puis le job `purge-account` efface données, fichiers, abonnement, client RevenueCat et personne PostHog (ADR-008).
        Possible aussi pour un compte suspendu ou banni (ADR-005). Ne résilie pas l'abonnement Apple (ADR-012). Profil inexistant ou déjà purgé → `404 profile_not_found`.
      responses:
        '204':
          description: Compte supprimé ; la purge suit.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/avatar:
    delete:
      operationId: removeAvatar
      tags: [identity]
      summary: Retirer ma photo de profil
      description: Retire la photo de profil ; l'ancien média est détaché puis purgé (ADR-008). Sans photo, ne change rien.
      responses:
        '200':
          description: Profil sans photo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/settings:
    patch:
      operationId: updateSettings
      tags: [identity]
      summary: Modifier mes paramètres
      description: Passe mon compte en privé ou en public, et choisit qui voit mes J'aime et commentaires dans l'onglet Amis des Reels (`friendsTabActivity`, ADR-029) ; seuls les champs présents sont modifiés. Passer en privé conserve mes abonnés ; seuls eux voient ensuite mes contenus (ADR-006). Passer en public accepte toutes les demandes d'abonnement en attente, dans la même transaction (compteurs compris).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: Profil avec les paramètres modifiés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/blocks:
    get:
      operationId: listBlocks
      tags: [social]
      summary: Comptes que j'ai bloqués
      description: |
        Comptes que j'ai bloqués, blocage le plus récent en premier, par pages de 20. Les comptes non actifs n'apparaissent pas. `relationship` vaut toujours `false` / `false` (bloquer supprime les abonnements).
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de comptes bloqués.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/close-friends:
    get:
      operationId: listCloseFriends
      tags: [social]
      summary: Mes amis proches
      description: |
        Ma liste d'amis proches, privée : ajout le plus récent en premier, par pages de 20. Les comptes bloqués dans un sens ou dans l'autre et les comptes non actifs n'apparaissent pas (ADR-006).
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de mes amis proches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/close-friends/{userId}:
    put:
      operationId: addCloseFriend
      tags: [social]
      summary: Ajouter un compte à mes amis proches
      description: |
        Sans notification : le compte ajouté n'est pas prévenu. Idempotent : un compte déjà dans la liste renvoie `204` sans effet. Sans corps.
        Seul un compte visible peut être ajouté : compte inexistant, bloqué dans un sens ou dans l'autre, ou non actif : `404 user_not_found` (ADR-006).
      parameters:
        - $ref: '#/components/parameters/CloseFriendId'
      responses:
        '204':
          description: Compte dans mes amis proches.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Compte introuvable ou invisible (`user_not_found`), ou onboarding non terminé (`profile_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/CannotCloseFriendSelf'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: removeCloseFriend
      tags: [social]
      summary: Retirer un compte de mes amis proches
      description: |
        Il perd aussitôt l'accès à mes contenus réservés aux amis proches, sans être prévenu. Idempotent : un compte absent de la liste renvoie `204` sans effet. Compte inexistant : `404 user_not_found`.
      parameters:
        - $ref: '#/components/parameters/CloseFriendId'
      responses:
        '204':
          description: Compte retiré de mes amis proches.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          $ref: '#/components/responses/CannotCloseFriendSelf'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/subscription/refresh:
    post:
      operationId: refreshSubscription
      tags: [billing]
      summary: Rafraîchir mon abonnement Clone Plus
      description: |
        Relit mon abonnement auprès de RevenueCat (ADR-012) : appelé après un achat, une restauration et au lancement de l'app. Sans corps.

        - Abonnement `plus` actif rafraîchi il y a moins de 5 minutes : aucun appel à RevenueCat, statut enregistré renvoyé.
        - Plan `free` : RevenueCat est toujours appelé (un achat récent doit être vu tout de suite).
        - RevenueCat injoignable : dernier statut connu renvoyé.
      responses:
        '200':
          description: Mon plan après rafraîchissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/onboarding:
    post:
      operationId: completeOnboarding
      tags: [identity]
      summary: Créer mon profil (fin de l'onboarding)
      description: Appelé à l'acceptation des conditions (ADR-018). Crée le profil de l'utilisateur authentifié.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOnboardingRequest'
      responses:
