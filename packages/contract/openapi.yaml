      operationId: acceptFollowRequest
      tags: [social]
      summary: Accepter une demande d'abonnement
      description: |
        Le demandeur devient mon abonné (compteurs dans la même transaction) et la demande est supprimée. Je suis notifié de ce nouvel abonné (`follow`), le demandeur de l'acceptation (`follow_accepted`). Sans corps.
