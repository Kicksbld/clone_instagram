        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de résultats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryViewerPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PlusRequired'
        '404':
          $ref: '#/components/responses/StoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/stories/archive:
    get:
      operationId: listArchivedStories
      tags: [stories]
      summary: Mes stories archivées, de la plus récente à la plus ancienne
      description: Stories expirées non supprimées de l’appelant uniquement. Curseur (created_at, id).
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
